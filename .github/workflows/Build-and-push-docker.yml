name: Build and Push Docker Images

on:
  push:
    branches: ["swift"]
    tags: ["code/v*"]

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: thalesgroup/fred-agent

jobs:
  # The image list, contexts and build args live in .github/docker-images.json
  # and are built by the reusable workflow — the same one every pull request
  # runs with publish: false.
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/Docker-images.yml
    with:
      publish: true

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/code/v')
    permissions:
      contents: write
    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dummy # we do not care about the image, we only want to extract the version
          tags: |
            type=match,pattern=code/(v.*),group=1

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.meta.outputs.version }}
          body: |
            # images:
            ```
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/fred-agents:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/knowledge-flow-backend:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/control-plane-backend:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/frontend:${{ steps.meta.outputs.version }}
            ```
          draft: false
          prerelease: false
