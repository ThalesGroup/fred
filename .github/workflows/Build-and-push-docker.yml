name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing code/v tag whose failed Docker publication should be recovered"
        type: string
        required: true
  push:
    branches: ["swift"]
    tags: ["code/v*"]

concurrency:
  group: docker-publication-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: thalesgroup/fred-agent

jobs:
  migration-guide:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/code/v')
    permissions:
      contents: read
    uses: ./.github/workflows/Validate-release-migration.yml
    with:
      release_tag: ${{ inputs.release_tag || '' }}

  # The image list, contexts and build args live in .github/docker-images.json
  # and are built by the reusable workflow — the same one every pull request
  # runs with publish: false.
  build-and-push:
    needs: migration-guide
    if: ${{ !cancelled() && (needs.migration-guide.result == 'success' || (github.event_name == 'push' && github.ref == 'refs/heads/swift')) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/Docker-images.yml
    with:
      publish: true
      release_tag: ${{ inputs.release_tag || '' }}
      source_ref: ${{ needs.migration-guide.outputs.source_sha }}

  create-release:
    needs: [migration-guide, build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/code/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.migration-guide.outputs.source_sha }}
          persist-credentials: false
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dummy # we do not care about the image, we only want to extract the version
          tags: |
            type=match,pattern=code/(v.*),group=1,value=${{ inputs.release_tag || github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Release ${{ steps.meta.outputs.version }}
          body: |
            # images:
            ```
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/fred-agents:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/knowledge-flow-backend:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/control-plane-backend:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/frontend:${{ steps.meta.outputs.version }}
            ```
          files: docs/swift/ops/releases/${{ steps.meta.outputs.version }}/migration.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
