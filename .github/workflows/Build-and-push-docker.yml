name: Build and Push Docker Images

on:
  push:
    branches: ["swift", "weaver"]
    tags: ["code/v*"]

# Serialize publications of a branch's mutable dev tag without interrupting
# an image matrix already publishing. Swift and Weaver remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: thalesgroup/fred-agent

jobs:
  migration-guide:
    if: startsWith(github.ref, 'refs/tags/code/v')
    permissions:
      contents: read
    uses: ./.github/workflows/Validate-release-migration.yml

  # The image list, contexts and build args live in .github/docker-images.json
  # and are built by the reusable workflow — the same one every pull request
  # runs with publish: false.
  build-and-push:
    needs: migration-guide
    if: ${{ !cancelled() && (needs.migration-guide.result == 'success' || github.ref_type != 'tag') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/Docker-images.yml
    with:
      publish: true

  publish-dev-charts:
    needs: build-and-push
    if: ${{ !cancelled() && github.ref == 'refs/heads/weaver' && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.2
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/download-artifact@v4
        with:
          pattern: weaver-image-*
          path: image-digests
          merge-multiple: true
      - name: Package charts with this build's image digests
        run: |
          uv run scripts/package_dev_charts.py --digests image-digests --revision "$GITHUB_SHA" \
            --version "5.0.0-dev.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --output packaged-charts
      - name: Publish development charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Publish the platform chart last, after its companion charts exist.
          for chart in agent-pod knowledge-base fred; do
            helm push packaged-charts/"${chart}"-*.tgz oci://ghcr.io/thalesgroup/fred-helm
          done
          echo "Published charts: 5.0.0-dev.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} (source ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/code/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dummy # we do not care about the image, we only want to extract the version
          tags: |
            type=match,pattern=code/(v.*),group=1

      - name: Generate Alembic head inventory
        id: alembic_heads
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          marker="ALEMBIC_HEADS_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'markdown<<%s\n' "$marker"
            python3 scripts/alembic_release_inventory.py --version "${RELEASE_VERSION#v}"
            printf '%s\n' "$marker"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.meta.outputs.version }}
          body: |
            # images:
            ```
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/fred-agents:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/knowledge-flow-backend:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/knowledge-flow-worker:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/knowledge-flow-worker-pymupdf:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/control-plane-backend:${{ steps.meta.outputs.version }}
            oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/frontend:${{ steps.meta.outputs.version }}
            ```

            ${{ steps.alembic_heads.outputs.markdown }}
          files: deploy/release-notes/releases/${{ steps.meta.outputs.version }}/migration.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
