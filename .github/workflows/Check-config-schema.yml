name: Check Config JSON Schemas

on:
  push:
    branches:
      - main
      - swift
  pull_request:
    branches:
      - main
      - swift
    # Pull requests only: a base-branch push still checks every schema.
    paths:
      - 'apps/control-plane-backend/**'
      - 'apps/knowledge-flow-backend/**'
      - 'apps/fred-agents/**'
      - 'apps/fred-manager/**'
      - 'libs/fred-*/**'
      - 'libs/capabilities/**'
      - 'deploy/charts/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/Check-config-schema.yml'

# A pull request only needs its newest commit checked, so a push supersedes the
# run it interrupts. A base-branch commit groups by sha instead: it keeps its own
# run and its own verdict, and never waits behind the commit before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-config:
    name: "${{ matrix.app }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: control-plane-backend
            dir: apps/control-plane-backend
            uv_args: --extra dev
          - app: knowledge-flow-backend
            dir: apps/knowledge-flow-backend
            uv_args: --extra dev
          - app: fred-agents
            dir: apps/fred-agents
            uv_args: ""
          # The Knowledge Base pod configuration, embedded in the knowledge-base chart.
          - app: fred-sdk
            dir: libs/fred-sdk
            uv_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync ${{ matrix.uv_args }}
        working-directory: ${{ matrix.dir }}

      - name: Schema drift check
        run: make check-config-schema-drift
        working-directory: ${{ matrix.dir }}

      - name: Config file validation
        run: make check-config-files
        working-directory: ${{ matrix.dir }}

  check-manager-config:
    name: "fred-manager configuration schema"
    runs-on: ubuntu-latest
    container: rust:1.99.0-slim-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: apt-get update && apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: Verify the configuration schema against the Rust types
        working-directory: apps/fred-manager
        run: cargo test --locked --test openapi configuration_schema_is_generated_offline_and_matches_the_chart_input

  check-chart-schema:
    name: "Helm chart values schema"
    runs-on: ubuntu-latest
    needs: [check-config, check-manager-config]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install inline script dependencies
        run: uv pip install --system "jsonschema>=4.0,<5" "pyyaml>=6.0"

      - name: Chart schema drift check
        run: make check-chart-schema-drift

      - name: Chart values validation
        run: make check-chart-values
