name: Publish frontend packages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare, publish, verify, or promote one package
        required: true
        default: prepare
        type: choice
        options: [prepare, publish, verify, promote]
      package:
        description: Package to operate on
        required: true
        type: choice
        options: [design-tokens, ui, iframe-sdk]
      prepared-run-id:
        description: Optional workflow run containing the prepared release directory
        required: false
        default: ""
        type: string
      version:
        description: Exact version to promote (promotion only)
        required: false
        default: ""
        type: string
      channel:
        description: Distribution tag to update (promotion only)
        required: false
        default: latest
        type: string
      dry-run:
        description: Validate publication or promotion without registry mutation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate source and inputs
        env:
          OPERATION: ${{ inputs.operation }}
          PREPARED_RUN_ID: ${{ inputs['prepared-run-id'] }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/swift"
          case "${OPERATION}" in
            prepare)
              test -z "${PREPARED_RUN_ID}"
              ;;
            publish|verify)
              if test -n "${PREPARED_RUN_ID}"; then
                case "${PREPARED_RUN_ID}" in *[!0-9]*) exit 1 ;; esac
              fi
              ;;
            promote)
              node .github/scripts/frontend-release-workflow.mjs validate-promotion
              ;;
            *) exit 1 ;;
          esac

  prepare:
    if: inputs.operation == 'prepare' || ((inputs.operation == 'publish' || inputs.operation == 'verify') && inputs['prepared-run-id'] == '')
    needs: authorize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: libs/frontend
      - name: Install production-host dependencies for iframe-sdk
        if: inputs.package == 'iframe-sdk'
        run: npm ci
        working-directory: apps/frontend
      - name: Provision the selected consumer cache
        if: inputs.package == 'ui' || inputs.package == 'iframe-sdk'
        run: make ${{ inputs.package == 'ui' && 'consumer-provision-react' || 'consumer-provision-iframe-sdk' }}
        working-directory: libs/frontend
      - name: Provision Chromium separately
        run: make browser-install
        working-directory: libs/frontend
      - name: Prepare the selected package
        run: make prepare-release PACKAGE="${{ inputs.package }}"
        working-directory: libs/frontend
      - name: Retain the portable release directory
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-release-${{ inputs.package }}
          path: libs/frontend/target/releases/${{ inputs.package }}
          if-no-files-found: error
          retention-days: 30

  release-directory:
    if: always() && !cancelled() && needs.authorize.result == 'success' && (inputs.operation == 'publish' || inputs.operation == 'verify') && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    needs: [authorize, prepare]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      path: ${{ steps.release.outputs.path }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the selected workflow run
        id: selected-run
        uses: actions/github-script@v7
        env:
          SELECTED_RUN_ID: ${{ inputs['prepared-run-id'] || github.run_id }}
        with:
          script: |
            const helper = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/frontend-release-workflow.mjs`)
            const identity = await helper.resolveSelectedWorkflowRun({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              runId: process.env.SELECTED_RUN_ID,
            })
            for (const [name, value] of Object.entries({
              repository: identity.repository,
              workflow: identity.workflow,
              run_id: identity.runId,
              source_commit: identity.sourceCommit,
            })) core.setOutput(name, value)
      - name: Download the prepared package directory
        uses: actions/download-artifact@v4
        with:
          name: frontend-npm-release-${{ inputs.package }}
          path: libs/frontend/target/releases/${{ inputs.package }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs['prepared-run-id'] || github.run_id }}
      - name: Resolve generated metadata
        id: release
        working-directory: libs/frontend
        env:
          EXPECTED_REPOSITORY: ${{ steps.selected-run.outputs.repository }}
          EXPECTED_WORKFLOW: ${{ steps.selected-run.outputs.workflow }}
          EXPECTED_RUN_ID: ${{ steps.selected-run.outputs.run_id }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.selected-run.outputs.source_commit }}
        run: |
          mapfile -t metadata_files < <(find "target/releases/${{ inputs.package }}" -name release.json -type f -print)
          test "${#metadata_files[@]}" -eq 1
          metadata=${metadata_files[0]}
          release_dir=$(dirname "${metadata}")
          version=$(jq -r .version "${metadata}")
          case "${version}" in
            *[!0-9A-Za-z.+-]*|'') exit 1 ;;
          esac
          test "${release_dir}" = "target/releases/${{ inputs.package }}/${version}"
          source_commit=$(node ../../.github/scripts/frontend-release-workflow.mjs validate-release-origin "${metadata}")
          case "${source_commit}" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#source_commit}" -eq 40
          git merge-base --is-ancestor "${source_commit}" "${GITHUB_SHA}"
          echo "path=${release_dir}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"
      - name: Repack the transfer for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-release-resolved-${{ inputs.package }}-${{ github.run_id }}
          path: libs/frontend/${{ steps.release.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    if: >-
      always() && !cancelled() &&
      inputs.operation == 'publish' && !inputs['dry-run'] &&
      needs.authorize.result == 'success' &&
      needs.release-directory.result == 'success'
    needs: [authorize, release-directory]
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: frontend-npm-publish-${{ inputs.package }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-directory.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
        working-directory: libs/frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-npm-release-resolved-${{ inputs.package }}-${{ github.run_id }}
          path: libs/frontend/target/release
      - name: Publish the exact prepared bytes
        run: make publish PACKAGE="${{ inputs.package }}" RELEASE_DIR=target/release AUTH_MODE=oidc
        working-directory: libs/frontend

  read-only:
    if: >-
      always() && !cancelled() &&
      (inputs.operation == 'verify' ||
      (inputs.operation == 'publish' && inputs['dry-run'])) &&
      needs.authorize.result == 'success' &&
      needs.release-directory.result == 'success'
    needs: [authorize, release-directory]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-directory.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
        working-directory: libs/frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-npm-release-resolved-${{ inputs.package }}-${{ github.run_id }}
          path: libs/frontend/target/release
      - name: Verify or dry-run publication
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          if test "${OPERATION}" = verify; then
            make verify-release PACKAGE="${{ inputs.package }}" RELEASE_DIR=target/release
          else
            make publish PACKAGE="${{ inputs.package }}" RELEASE_DIR=target/release AUTH_MODE=token DRY_RUN=1
          fi
        working-directory: libs/frontend

  promote-dry-run:
    if: inputs.operation == 'promote' && inputs['dry-run']
    needs: authorize
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
        working-directory: libs/frontend
      - name: Validate promotion without credentials
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: make promote PACKAGE="${{ inputs.package }}" AUTH_MODE=token DRY_RUN=1
        working-directory: libs/frontend

  promote:
    if: inputs.operation == 'promote' && !inputs['dry-run']
    needs: authorize
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: frontend-npm-publish-${{ inputs.package }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
        working-directory: libs/frontend
      - name: Promote an existing exact version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: make promote PACKAGE="${{ inputs.package }}" AUTH_MODE=token
        working-directory: libs/frontend
