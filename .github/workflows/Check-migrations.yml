name: Check Alembic Migrations

on:
  push:
    branches:
      - main
      - swift
      - develop
  pull_request:
    branches:
      - main
      - swift
      - develop

# A pull request only needs its newest commit checked, so a push supersedes the
# run it interrupts. A base-branch commit groups by sha instead: it keeps its own
# run and its own verdict, and never waits behind the commit before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN: these jobs only check out the repo and run
# migration checks — no write access is required (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  check-migrations-heads:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (control-plane-backend)
        run: uv sync
        working-directory: apps/control-plane-backend

      - name: Install dependencies (knowledge-flow-backend)
        run: uv sync
        working-directory: apps/knowledge-flow-backend

      - name: Install dependencies (fred-runtime)
        run: uv sync
        working-directory: libs/fred-runtime

      - name: Install dependencies (fred-capability-writable-document)
        run: uv sync
        working-directory: libs/fred-capability-writable-document

      - name: Check single Alembic head per tree
        run: make db-check-combined-heads

  check-migrations-sqlite:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (control-plane-backend)
        run: uv sync
        working-directory: apps/control-plane-backend

      - name: Install dependencies (knowledge-flow-backend)
        run: uv sync
        working-directory: apps/knowledge-flow-backend

      - name: Install dependencies (fred-runtime)
        run: uv sync
        working-directory: libs/fred-runtime

      - name: Install dependencies (fred-capability-writable-document)
        run: uv sync
        working-directory: libs/fred-capability-writable-document

      - name: Run combined SQLite migration checks
        run: make db-check-combined-sqlite

  check-migrations-postgres:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (control-plane-backend)
        run: uv sync
        working-directory: apps/control-plane-backend

      - name: Install dependencies (knowledge-flow-backend)
        run: uv sync
        working-directory: apps/knowledge-flow-backend

      - name: Install dependencies (fred-runtime)
        run: uv sync
        working-directory: libs/fred-runtime

      - name: Install dependencies (fred-capability-writable-document)
        run: uv sync
        working-directory: libs/fred-capability-writable-document

      - name: Run combined PostgreSQL migration checks
        run: make db-check-combined-postgres
