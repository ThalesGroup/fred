name: Docker images

# Reusable: one definition of how every image in .github/docker-images.json is
# built. Callers pass publish=false for a pre-merge check, publish=true to
# release. Nothing else may hold a second copy of the image list.

on:
  workflow_call:
    inputs:
      publish:
        description: "Push to the registry. Build-only (no login, no credentials) when false."
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: thalesgroup/fred-agent

jobs:
  resolve:
    name: Resolve image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.include }}
      scan_matrix: ${{ steps.matrix.outputs.scan_include }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # A Dockerfile nobody listed is a Dockerfile nobody builds — that is how a
      # missing COPY line reached a release tag. Adding one must be a conscious
      # "build it" or "here is why not", never a silent omission.
      - name: Every Dockerfile is accounted for
        run: |
          set -euo pipefail
          manifest=.github/docker-images.json
          failed=0

          mapfile -t discovered < <(find . \
            -type d \( -name .git -o -name node_modules -o -name .venv \) -prune -o \
            -type f \( -name 'Dockerfile*' -o -name '*.Dockerfile' \) -print |
            sed 's|^\./||' | sort)

          # A discovery step that finds nothing would pass this guard vacuously,
          # which is the very failure mode it exists to prevent.
          if [ "${#discovered[@]}" -eq 0 ]; then
            echo "::error file=$manifest::Found no Dockerfile at all. Discovery is broken, not the repository."
            exit 1
          fi
          echo "Discovered ${#discovered[@]} Dockerfiles."

          for dockerfile in "${discovered[@]}"; do
            if ! jq -e --arg d "$dockerfile" '[.images[], .excluded[]] | any(.dockerfile == $d)' "$manifest" > /dev/null; then
              echo "::error file=$dockerfile::Not listed in $manifest. Add it to .images so every pull request builds it, or to .excluded with a reason."
              failed=1
            fi
          done

          for dockerfile in $(jq -r '[.images[], .excluded[]] | .[].dockerfile' "$manifest"); do
            if [ ! -f "$dockerfile" ]; then
              echo "::error file=$manifest::Lists $dockerfile, which no longer exists. Remove or rename the entry."
              failed=1
            fi
          done

          exit $failed

      - name: Build the matrix
        id: matrix
        run: |
          set -euo pipefail
          include=$(jq -c --argjson publish ${{ inputs.publish }} \
            '[.images[] | select(($publish | not) or .publish) | . + {scan: (.scan != false)}]' \
            .github/docker-images.json)
          scan_include=$(echo "$include" | jq -c '[.[] | select(.scan) | {name}]')
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "scan_include=$scan_include" >> "$GITHUB_OUTPUT"
          echo "$include" | jq -r '.[] | "\(.name)\t\(.dockerfile)"'

  build:
    name: ${{ inputs.publish && 'Push' || 'Build' }} ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # Only the pre-merge path needs it: the gha cache exporter requires the
      # docker-container driver, and the publish path keeps the plain default
      # builder it has always released from.
      - name: Set up Docker Buildx
        if: ${{ !inputs.publish }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags keep the semver contract. Swift branch pushes publish
      # dev images under dedicated tags so they never collide with main-line
      # release automation.
      - name: Extract metadata
        id: meta
        if: inputs.publish
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/code/v') }},pattern=code/(v.*),group=1
            type=raw,enable=${{ github.ref == 'refs/heads/swift' }},value=swift-dev

      # Pre-merge builds read and write the Actions cache to stay affordable.
      # The publish path stays uncached so a released image never reuses layers
      # built from an unmerged branch.
      - name: Build${{ inputs.publish && ' and push' || '' }} Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ inputs.publish }}
          load: ${{ github.event_name == 'pull_request' && !inputs.publish && matrix.scan }}
          tags: ${{ inputs.publish && steps.meta.outputs.tags || format('fred-pr/{0}:scan', matrix.name) }}
          labels: ${{ steps.meta.outputs.labels }} # many various informations
          # The empty string is falsy in expressions, so it has to sit on the
          # falsy side: `publish && '' || format(...)` returns the format branch
          # for both values of publish and asks a driver-less builder to export.
          cache-from: ${{ !inputs.publish && format('type=gha,scope={0}', matrix.name) || '' }}
          # ignore-error: the cache is an optimisation, so a GitHub cache-service
          # timeout must cost a slower build next time, not a red check on an
          # image that already compiled.
          cache-to: ${{ !inputs.publish && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.name) || '' }}

      - name: Scan built image for CVEs
        if: ${{ github.event_name == 'pull_request' && !inputs.publish && matrix.scan }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ format('fred-pr/{0}:scan', matrix.name) }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: true
          format: json
          output: trivy-results.json
          exit-code: '0'

      - name: Upload Trivy report
        if: ${{ github.event_name == 'pull_request' && !inputs.publish && matrix.scan }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-results.json
          retention-days: 14

  trivy:
    name: Scan Trivy / ${{ matrix.name }}
    if: ${{ github.event_name == 'pull_request' && !inputs.publish }}
    needs: [resolve, build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.scan_matrix) }}

    steps:
      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-${{ matrix.name }}

      - name: Report scan findings
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          jq -e '.ArtifactType == "container_image" and (.Results | length > 0)' trivy-results.json > /dev/null
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          packages=$(jq '[.Results[]?.Packages[]?] | length' trivy-results.json)
          echo "### Trivy: ${IMAGE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Package inventory entries: ${packages}. Full JSON report: artifact \`trivy-${IMAGE_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
          echo '| Severity | Findings |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: |' >> "$GITHUB_STEP_SUMMARY"
          for severity in UNKNOWN LOW MEDIUM HIGH CRITICAL; do
            total=$(jq --arg severity "$severity" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $severity)] | length' trivy-results.json)
            echo "| ${severity} | ${total} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo -e 'Severity\tCVE\tPackage\tInstalled\tFixed\tTarget'
          jq -r '.Results[]? as $result | $result.Vulnerabilities[]? |
            [.Severity // "UNKNOWN", .VulnerabilityID // "-", .PkgName // "-",
             .InstalledVersion // "-", .FixedVersion // "-", $result.Target // "-"] | @tsv
          ' trivy-results.json
          if (( count > 0 )); then
            ids=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL") | .VulnerabilityID // "unknown"] | unique | .[:20] | join(", ")' trivy-results.json)
            echo "::warning title=Critical CVEs in ${IMAGE_NAME}::Trivy found ${count} critical vulnerability findings. See the job summary and report artifact."
            echo "${count} critical OS/library vulnerability findings. CVE IDs (first 20): ${ids}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No critical OS/library vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi

  trivy-frontend-dependencies:
    name: Scan Trivy / frontend dependencies
    if: ${{ github.event_name == 'pull_request' && !inputs.publish }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Scan frontend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/frontend
          trivy-config: .github/trivy-frontend.yaml
          scanners: vuln
          vuln-type: library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: true
          format: json
          output: trivy-frontend-dependencies.json
          exit-code: '0'

      - name: Upload frontend dependency report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-dependencies
          path: trivy-frontend-dependencies.json
          retention-days: 14

      - name: Report frontend dependency CVEs
        run: |
          set -euo pipefail
          jq -e 'any(.Results[]?; (.Target // "" | endswith("package-lock.json")) and ((.Packages // []) | length > 0))' trivy-frontend-dependencies.json > /dev/null
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-frontend-dependencies.json)
          packages=$(jq '[.Results[]?.Packages[]?] | length' trivy-frontend-dependencies.json)
          echo '### Trivy: frontend dependencies' >> "$GITHUB_STEP_SUMMARY"
          echo "Package inventory entries: ${packages}. Full JSON report: artifact \`trivy-frontend-dependencies\`." >> "$GITHUB_STEP_SUMMARY"
          echo '| Severity | Findings |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: |' >> "$GITHUB_STEP_SUMMARY"
          for severity in UNKNOWN LOW MEDIUM HIGH CRITICAL; do
            total=$(jq --arg severity "$severity" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $severity)] | length' trivy-frontend-dependencies.json)
            echo "| ${severity} | ${total} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo -e 'Severity\tCVE\tPackage\tInstalled\tFixed\tTarget'
          jq -r '.Results[]? as $result | $result.Vulnerabilities[]? |
            [.Severity // "UNKNOWN", .VulnerabilityID // "-", .PkgName // "-",
             .InstalledVersion // "-", .FixedVersion // "-", $result.Target // "-"] | @tsv
          ' trivy-frontend-dependencies.json
          if (( count > 0 )); then
            echo "::warning title=Critical CVEs in frontend dependencies::Trivy found ${count} critical dependency findings. See the job summary and report artifact."
          else
            echo 'No critical frontend dependency vulnerabilities found.' >> "$GITHUB_STEP_SUMMARY"
          fi
