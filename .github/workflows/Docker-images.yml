name: Docker images

# Reusable: one definition of how every image in .github/docker-images.json is
# built. Callers pass publish=false for a pre-merge check (affected images
# only), publish=true for swift (changed images) or release tags (all).

on:
  workflow_call:
    inputs:
      publish:
        description: "Push to the registry. Build-only (no login, no credentials) when false."
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: thalesgroup/fred-agent

jobs:
  resolve:
    name: Resolve image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.include }}
      scan_matrix: ${{ steps.matrix.outputs.scan_include }}
      frontend_scan: ${{ steps.matrix.outputs.frontend_scan }}

    steps:
      - name: Validate manual publish ref
        if: ${{ inputs.publish && github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/swift ]]; then
            echo '::error::Manual image publication must run from the swift branch.'
            exit 1
          fi

      # PR and swift selection diff against the merge base.
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/code/v') && 1 || 0 }}

      # A Dockerfile nobody listed is a Dockerfile nobody builds — that is how a
      # missing COPY line reached a release tag. Adding one must be a conscious
      # "build it" or "here is why not", never a silent omission.
      - name: Every Dockerfile is accounted for
        run: |
          set -euo pipefail
          manifest=.github/docker-images.json
          failed=0

          mapfile -t discovered < <(find . \
            -type d \( -name .git -o -name node_modules -o -name .venv \) -prune -o \
            -type f \( -name 'Dockerfile*' -o -name '*.Dockerfile' \) -print |
            sed 's|^\./||' | sort)

          # A discovery step that finds nothing would pass this guard vacuously,
          # which is the very failure mode it exists to prevent.
          if [ "${#discovered[@]}" -eq 0 ]; then
            echo "::error file=$manifest::Found no Dockerfile at all. Discovery is broken, not the repository."
            exit 1
          fi
          echo "Discovered ${#discovered[@]} Dockerfiles."

          for dockerfile in "${discovered[@]}"; do
            if ! jq -e --arg d "$dockerfile" '[.images[], .excluded[]] | any(.dockerfile == $d)' "$manifest" > /dev/null; then
              echo "::error file=$dockerfile::Not listed in $manifest. Add it to .images so every pull request builds it, or to .excluded with a reason."
              failed=1
            fi
          done

          for dockerfile in $(jq -r '[.images[], .excluded[]] | .[].dockerfile' "$manifest"); do
            if [ ! -f "$dockerfile" ]; then
              echo "::error file=$manifest::Lists $dockerfile, which no longer exists. Remove or rename the entry."
              failed=1
            fi
          done

          exit $failed

      - name: Test image selection
        if: ${{ !inputs.publish }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_select_docker_images.py' -v

      - name: Check agent base lock alignment
        run: python3 -m unittest discover -s scripts/tests -p 'test_agent_base_lock.py' -v

      # A pull request builds only the images its changes reach; the step
      # summary lists each image with the paths that selected or skipped it.
      - name: Select images
        id: matrix
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.ref == 'refs/heads/swift' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.ref == 'refs/heads/swift' && github.sha || github.event.pull_request.head.sha }}
        run: python3 scripts/select_docker_images.py --publish ${{ inputs.publish }} --base "$BASE_SHA" --head "$HEAD_SHA"

  build:
    name: ${{ inputs.publish && 'Push' || 'Build' }} ${{ matrix.name }}
    needs: resolve
    # An empty matrix is an error in Actions; a docs-only PR builds nothing.
    if: ${{ needs.resolve.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Read frontend Node version
        if: matrix.name == 'frontend'
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      # Releases export an OCI layout with provenance for scanning and also push.
      # PR smoke tests still load a Docker tar into the local daemon.
      - name: Set up Docker Buildx
        if: ${{ !inputs.publish || startsWith(github.ref, 'refs/tags/code/v') }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags keep the semver contract. Swift branch pushes publish
      # dev images under dedicated tags so they never collide with main-line
      # release automation.
      - name: Extract metadata
        id: meta
        if: inputs.publish
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/code/v') }},pattern=code/(v.*),group=1
            type=raw,enable=${{ github.ref == 'refs/heads/swift' }},value=swift-dev

      - name: Extract agent base metadata
        id: base-meta
        if: ${{ inputs.publish && matrix.name == 'fred-agents' }}
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/fred-agents-base
          tags: |
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/code/v') }},pattern=code/(v.*),group=1
            type=raw,enable=${{ github.ref == 'refs/heads/swift' }},value=swift-dev

      - name: Build agent base
        id: build-base
        if: ${{ matrix.name == 'fred-agents' && (!inputs.publish || github.ref != 'refs/heads/swift' || matrix.base_changed) }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/fred-agents/dockerfiles/Dockerfile-base
          push: ${{ inputs.publish }}
          outputs: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/code/v') && 'type=oci,tar=false,dest=/tmp/base-tag-image' || (!inputs.publish && 'type=oci,dest=/tmp/base-pr-image.tar' || '') }}
          provenance: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/code/v') && 'mode=max' || '' }}
          tags: ${{ inputs.publish && steps.base-meta.outputs.tags || 'fred-pr/fred-agents-base:scan' }}
          labels: ${{ steps.base-meta.outputs.labels }}
          cache-from: ${{ !inputs.publish && 'type=gha,scope=fred-agents-base' || '' }}
          cache-to: ${{ !inputs.publish && 'type=gha,mode=max,scope=fred-agents-base,ignore-error=true' || '' }}

      - name: Prepare local agent base context
        if: ${{ matrix.name == 'fred-agents' && !inputs.publish }}
        run: |
          mkdir -p /tmp/agent-base
          tar -xf /tmp/base-pr-image.tar -C /tmp/agent-base

      - name: Resolve agent base reference
        id: agent-base
        if: matrix.name == 'fred-agents'
        env:
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ steps.meta.outputs.version }}
          BASE_DIGEST: ${{ steps.build-base.outputs.digest }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            if [[ -n "$BASE_DIGEST" ]]; then
              echo "build_arg=BASE_IMAGE=${REGISTRY}/${REGISTRY_NAMESPACE}/fred-agents-base@${BASE_DIGEST}" >> "$GITHUB_OUTPUT"
            else
              echo "build_arg=BASE_IMAGE=${REGISTRY}/${REGISTRY_NAMESPACE}/fred-agents-base:${VERSION}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'build_arg=BASE_IMAGE=agent-base' >> "$GITHUB_OUTPUT"
          fi

      # Pre-merge builds read and write the Actions cache to stay affordable.
      # The publish path stays uncached so a released image never reuses layers
      # built from an unmerged branch.
      - name: Build${{ inputs.publish && ' and push' || '' }} Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.name == 'fred-agents' && !inputs.publish && 'agent-base=oci-layout:///tmp/agent-base' || '' }}
          build-args: |
            ${{ matrix.build_args }}
            ${{ matrix.name == 'frontend' && format('NODE_VERSION={0}', steps.node.outputs.version) || '' }}
            ${{ steps.agent-base.outputs.build_arg }}
          push: ${{ inputs.publish }}
          outputs: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/code/v') && 'type=oci,tar=false,dest=/tmp/tag-image' || (github.event_name == 'pull_request' && !inputs.publish && matrix.scan && 'type=docker,dest=/tmp/pr-image.tar' || '') }}
          # OCI supports the image index carrying provenance attestations.
          provenance: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/code/v') && 'mode=max' || '' }}
          tags: ${{ inputs.publish && steps.meta.outputs.tags || format('fred-pr/{0}:scan', matrix.name) }}
          labels: ${{ steps.meta.outputs.labels }} # many various informations
          # The empty string is falsy in expressions, so it has to sit on the
          # falsy side: `publish && '' || format(...)` returns the format branch
          # for both values of publish and asks a driver-less builder to export.
          cache-from: ${{ !inputs.publish && format('type=gha,scope={0}', matrix.name) || '' }}
          # ignore-error: the cache is an optimisation, so a GitHub cache-service
          # timeout must cost a slower build next time, not a red check on an
          # image that already compiled.
          cache-to: ${{ !inputs.publish && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.name) || '' }}

      - name: Record agent image archive sizes
        if: ${{ matrix.name == 'fred-agents' && github.event_name == 'pull_request' && !inputs.publish }}
        run: |
          echo '### Agent image archive sizes' >> "$GITHUB_STEP_SUMMARY"
          echo "Base OCI archive: $(stat -c%s /tmp/base-pr-image.tar) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "Final Docker archive: $(stat -c%s /tmp/pr-image.tar) bytes" >> "$GITHUB_STEP_SUMMARY"

      # Trivy's vuln scanner matches make sbom CVES=true for the pushed tag.
      - name: Install Trivy for release SBOM
        if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/code/v') }}
        uses: ./.github/actions/setup-trivy

      - name: Generate CycloneDX with CVEs for published image
        if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/code/v') }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          input: /tmp/tag-image
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: true
          format: cyclonedx
          output: image-sbom.cdx.json
          exit-code: "0"

      - name: Generate CycloneDX with CVEs for published agent base
        if: ${{ matrix.name == 'fred-agents' && inputs.publish && startsWith(github.ref, 'refs/tags/code/v') }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          input: /tmp/base-tag-image
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: true
          format: cyclonedx
          output: base-image-sbom.cdx.json
          exit-code: "0"

      - name: Verify CycloneDX report
        if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/code/v') }}
        run: jq -e '.bomFormat == "CycloneDX" and ((.components // []) | length > 0)' image-sbom.cdx.json > /dev/null

      - name: Verify agent base CycloneDX report
        if: ${{ matrix.name == 'fred-agents' && inputs.publish && startsWith(github.ref, 'refs/tags/code/v') }}
        run: jq -e '.bomFormat == "CycloneDX" and ((.components // []) | length > 0)' base-image-sbom.cdx.json > /dev/null

      - name: Upload CycloneDX report
        if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/code/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload agent base CycloneDX report
        if: ${{ matrix.name == 'fred-agents' && inputs.publish && startsWith(github.ref, 'refs/tags/code/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom-fred-agents-base
          path: base-image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Set up uv for PDF corpus generation
        if: ${{ github.event_name == 'pull_request' && !inputs.publish && startsWith(matrix.name, 'knowledge-flow-backend') }}
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Verify PDF image inventory and real processors
        timeout-minutes: 15
        if: ${{ github.event_name == 'pull_request' && !inputs.publish && startsWith(matrix.name, 'knowledge-flow-backend') }}
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          docker load -i /tmp/pr-image.tar
          image="fred-pr/${IMAGE_NAME}:scan"
          mkdir -p /tmp/pdf-evidence
          docker image inspect "$image" --format '{{.Id}}' > /tmp/pdf-evidence/image-id.txt
          uv run --no-project --with reportlab==4.3.1 --with python-pptx --with pillow developer_tools/benchmarks/pdf_ingestion.py generate /tmp/pdf-corpus
          cp /tmp/pdf-corpus/manifest.json /tmp/pdf-evidence/corpus-manifest.json
          option=()
          if [[ "$IMAGE_NAME" == *-pymupdf ]]; then option=(--pymupdf); fi
          docker run --rm --entrypoint python -v "$PWD/scripts:/checks:ro" "$image" /checks/check_pdf_dependencies.py "${option[@]}" > /tmp/pdf-evidence/inventory.json
          docker run --rm --entrypoint python -v "$PWD/developer_tools/benchmarks:/checks:ro" -v /tmp/pdf-corpus:/corpus:ro -v "$PWD/apps/knowledge-flow-backend/config:/config:ro" "$image" /checks/pdf_image_smoke.py /corpus "${option[@]}" > /tmp/pdf-evidence/processors.json 2> /tmp/pdf-evidence/processors.log

      - name: Retain PDF image evidence
        if: ${{ always() && github.event_name == 'pull_request' && !inputs.publish && startsWith(matrix.name, 'knowledge-flow-backend') }}
        uses: actions/upload-artifact@v4
        with:
          name: pdf-evidence-${{ matrix.name }}
          path: /tmp/pdf-evidence
          retention-days: 14

      - name: Upload built image for scanning
        if: ${{ github.event_name == 'pull_request' && !inputs.publish && matrix.scan }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-image-${{ matrix.name }}
          path: /tmp/pr-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload agent base for scanning
        if: ${{ matrix.name == 'fred-agents' && github.event_name == 'pull_request' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-image-fred-agents-base
          path: /tmp/base-pr-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  trivy:
    name: Scan Trivy / ${{ matrix.name }}
    if: ${{ github.event_name == 'pull_request' && !inputs.publish && needs.resolve.outputs.scan_matrix != '[]' }}
    needs: [resolve, build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.scan_matrix) }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: scan-image-${{ matrix.name }}
          path: /tmp

      - name: Prepare base OCI layout for scanning
        if: matrix.name == 'fred-agents-base'
        run: |
          mkdir -p /tmp/base-scan-image
          tar -xf /tmp/base-pr-image.tar -C /tmp/base-scan-image

      - name: Install Trivy
        uses: ./.github/actions/setup-trivy

      - name: Scan built image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          input: ${{ matrix.name == 'fred-agents-base' && '/tmp/base-scan-image' || '/tmp/pr-image.tar' }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: true
          format: json
          output: trivy-results.json
          exit-code: "0"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-results.json
          retention-days: 14

      - name: Record image licenses and SBOM
        if: ${{ startsWith(matrix.name, 'fred-agents') || startsWith(matrix.name, 'knowledge-flow-backend') }}
        env:
          IMAGE_INPUT: ${{ matrix.name == 'fred-agents-base' && '/tmp/base-scan-image' || '/tmp/pr-image.tar' }}
        run: |
          trivy image --input "$IMAGE_INPUT" --scanners license --license-full --format json --output image-licenses.json
          trivy image --input "$IMAGE_INPUT" --format cyclonedx --timeout 15m --output image-sbom.cdx.json

      - name: Retain image license evidence
        if: ${{ startsWith(matrix.name, 'fred-agents') || startsWith(matrix.name, 'knowledge-flow-backend') }}
        uses: actions/upload-artifact@v4
        with:
          name: licenses-${{ matrix.name }}
          path: |
            image-licenses.json
            image-sbom.cdx.json
          retention-days: 14

      - name: Report scan findings
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          jq -e '.ArtifactType == "container_image" and (.Results | length > 0)' trivy-results.json > /dev/null
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          packages=$(jq '[.Results[]?.Packages[]?] | length' trivy-results.json)
          echo "### Trivy: ${IMAGE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Package inventory entries: ${packages}. Full JSON report: artifact \`trivy-${IMAGE_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
          echo '| Severity | Findings |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: |' >> "$GITHUB_STEP_SUMMARY"
          for severity in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
            total=$(jq --arg severity "$severity" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $severity)] | length' trivy-results.json)
            echo "| ${severity} | ${total} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo -e 'Severity\tCVE\tPackage\tInstalled\tFixed\tTarget'
          jq -r '
            def severity_rank:
              if . == "CRITICAL" then 0 elif . == "HIGH" then 1
              elif . == "MEDIUM" then 2 elif . == "LOW" then 3 else 4 end;
            [.Results[]? as $result | $result.Vulnerabilities[]? |
              [.Severity // "UNKNOWN", .VulnerabilityID // "-", .PkgName // "-",
               .InstalledVersion // "-", .FixedVersion // "-", $result.Target // "-"]]
            | sort_by(.[0] | severity_rank)[] | @tsv
          ' trivy-results.json
          if (( count > 0 )); then
            ids=$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL") | .VulnerabilityID // "unknown"] | unique | .[:20] | join(", ")' trivy-results.json)
            echo "::warning title=Critical CVEs in ${IMAGE_NAME}::Trivy found ${count} critical vulnerability findings. See the job summary and report artifact."
            echo "${count} critical OS/library vulnerability findings. CVE IDs (first 20): ${ids}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No critical OS/library vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi

  trivy-frontend-dependencies:
    name: Scan Trivy / frontend dependencies
    if: ${{ github.event_name == 'pull_request' && !inputs.publish && needs.resolve.outputs.frontend_scan == 'true' }}
    needs: [resolve, build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Install Trivy
        uses: ./.github/actions/setup-trivy

      - name: Scan frontend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: apps/frontend
          trivy-config: .github/trivy-frontend.yaml
          scanners: vuln
          vuln-type: library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: true
          format: json
          output: trivy-frontend-dependencies.json
          exit-code: "0"

      - name: Upload frontend dependency report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-dependencies
          path: trivy-frontend-dependencies.json
          retention-days: 14

      - name: Report frontend dependency CVEs
        run: |
          set -euo pipefail
          jq -e 'any(.Results[]?; (.Target // "" | endswith("package-lock.json")) and ((.Packages // []) | length > 0))' trivy-frontend-dependencies.json > /dev/null
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-frontend-dependencies.json)
          packages=$(jq '[.Results[]?.Packages[]?] | length' trivy-frontend-dependencies.json)
          echo '### Trivy: frontend dependencies' >> "$GITHUB_STEP_SUMMARY"
          echo "Package inventory entries: ${packages}. Full JSON report: artifact \`trivy-frontend-dependencies\`." >> "$GITHUB_STEP_SUMMARY"
          echo '| Severity | Findings |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: |' >> "$GITHUB_STEP_SUMMARY"
          for severity in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
            total=$(jq --arg severity "$severity" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $severity)] | length' trivy-frontend-dependencies.json)
            echo "| ${severity} | ${total} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo -e 'Severity\tCVE\tPackage\tInstalled\tFixed\tTarget'
          jq -r '
            def severity_rank:
              if . == "CRITICAL" then 0 elif . == "HIGH" then 1
              elif . == "MEDIUM" then 2 elif . == "LOW" then 3 else 4 end;
            [.Results[]? as $result | $result.Vulnerabilities[]? |
              [.Severity // "UNKNOWN", .VulnerabilityID // "-", .PkgName // "-",
               .InstalledVersion // "-", .FixedVersion // "-", $result.Target // "-"]]
            | sort_by(.[0] | severity_rank)[] | @tsv
          ' trivy-frontend-dependencies.json
          if (( count > 0 )); then
            echo "::warning title=Critical CVEs in frontend dependencies::Trivy found ${count} critical dependency findings. See the job summary and report artifact."
          else
            echo 'No critical frontend dependency vulnerabilities found.' >> "$GITHUB_STEP_SUMMARY"
          fi
