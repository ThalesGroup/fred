name: Check pending request

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A pull request only needs its newest commit checked, so a push supersedes the
# run it interrupts. A base-branch commit groups by sha instead: it keeps its own
# run and its own verdict, and never waits behind the commit before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Job to detect changes
  detect-changes:
    runs-on: ubuntu-24.04
    # Those outputs are variables that will be shared to the check
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      frontend-packages: ${{ steps.changes.outputs.frontend-packages }}
      agentic: ${{ steps.changes.outputs.agentic }}
      deploy-chart: ${{ steps.changes.outputs.deploy-chart }}
      python-modules: ${{ steps.matrices.outputs.python-modules }}
      openapi-drift: ${{ steps.matrices.outputs.openapi-drift }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Enough needed to detect changes

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/Check-pending-requests.yml'
            frontend-packages:
              - 'libs/frontend/**'
              - 'apps/frontend/src/styles/color-ramps.css'
              - 'apps/frontend/src/styles/colors-semantic-light.css'
              - 'apps/frontend/src/styles/colors-semantic-dark.css'
              - 'apps/frontend/src/styles/colors-state-semantic.css'
              - 'apps/frontend/src/styles/shadow-light.css'
              - 'apps/frontend/src/styles/shadow-dark.css'
              - 'apps/frontend/src/styles/spacings.css'
              - 'apps/frontend/src/styles/radius.css'
              - 'apps/frontend/src/styles/motion.css'
              - 'apps/frontend/src/styles/gradients.css'
              - 'apps/frontend/src/styles/typography.css'
              - 'apps/frontend/src/rework/components/shared/utils/Type.ts'
              - 'apps/frontend/src/rework/components/shared/atoms/Icon/Icon.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/Icon/Icon.module.scss'
              - 'apps/frontend/src/rework/components/shared/atoms/Spinner/Spinner.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/Spinner/Spinner.module.css'
              - 'apps/frontend/src/rework/components/shared/atoms/Button/Button.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/Button/Button.module.scss'
              - 'apps/frontend/src/rework/components/shared/atoms/IconButton/IconButton.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/IconButton/IconButton.module.scss'
              - 'apps/frontend/src/rework/components/shared/atoms/TextInput/TextInput.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/TextInput/TextInput.module.scss'
              - 'apps/frontend/src/rework/components/shared/atoms/Checkbox/Checkbox.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/Checkbox/Checkbox.module.scss'
              - 'apps/frontend/src/rework/components/shared/atoms/Chip/Chip.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/Chip/Chip.module.css'
              - 'apps/frontend/src/rework/components/shared/atoms/Tooltip/Tooltip.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/Tooltip/Tooltip.module.scss'
              - 'apps/frontend/src/rework/components/shared/atoms/MenuItem/MenuItem.tsx'
              - 'apps/frontend/src/rework/components/shared/atoms/MenuItem/MenuItem.module.scss'
              - 'apps/frontend/src/rework/components/shared/molecules/Menu/Menu.tsx'
              - 'apps/frontend/src/rework/components/shared/molecules/Menu/Menu.module.scss'
              - 'apps/frontend/src/rework/components/shared/molecules/Select/Select.tsx'
              - 'apps/frontend/src/rework/components/shared/molecules/Select/Select.module.scss'
              - 'apps/frontend/src/rework/components/shared/molecules/Dialog/DialogPrimitive.tsx'
              - 'apps/frontend/src/rework/components/shared/molecules/Dialog/Dialog.module.css'
              - 'apps/frontend/src/rework/components/shared/utils/Portal.tsx'
              - 'apps/frontend/src/rework/components/shared/utils/viewport.ts'
              - 'apps/frontend/src/index.scss'
              - 'apps/frontend/src/styles/index.css'
              - 'apps/frontend/src/assets/fonts/Geist.woff2'
              - 'apps/frontend/src/assets/fonts/Geist-Italic.woff2'
              - 'apps/frontend/src/assets/fonts/material-symbols-outlined.woff2'
              - 'apps/frontend/package.json'
              - 'apps/frontend/package-lock.json'
              - 'apps/frontend/src/rework/features/applications/applicationProtocol.ts'
              - 'apps/frontend/src/rework/features/applications/applicationProtocol.test.ts'
              - 'apps/frontend/src/rework/features/applications/applicationHost.ts'
              - 'apps/frontend/src/rework/features/applications/applicationHost.test.ts'
              - 'apps/frontend/src/rework/features/applications/applicationPath.ts'
              - 'apps/frontend/src/rework/features/applications/applicationPath.test.ts'
              - 'apps/frontend/src/rework/features/applications/applicationRequest.ts'
              - 'apps/frontend/src/rework/features/applications/applicationRequest.test.ts'
              - 'apps/frontend/src/rework/components/pages/TeamApplicationHostPage/TeamApplicationHostPage.tsx'
              - 'apps/frontend/src/rework/components/pages/TeamApplicationHostPage/TeamApplicationHostPage.test.tsx'
              - 'apps/frontend/src/rework/components/pages/TeamApplicationHostPage/TeamApplicationHostPage.sdk-integration.test.tsx'
              - 'apps/frontend/src/app/ApplicationContextStruct.tsx'
              - 'apps/frontend/src/app/ApplicationContextProvider.tsx'
              - 'apps/frontend/src/i18n.ts'
              - 'LICENSE'
              - 'Makefile'
              - '.github/workflows/Check-pending-requests.yml'
              - '.github/workflows/Publish-frontend-packages.yml'
              - 'docs/swift/FRED-FRONTEND-PACKAGING-RFC.md'
            agentic:
              - 'agentic-backend/**'
            deploy-chart:
              - 'deploy/charts/**'
            knowledge-flow:
              - 'apps/knowledge-flow-backend/**'
            fred-pod:
              - 'libs/fred-pod/**'
            fred-core:
              - 'libs/fred-core/**'
            control-plane:
              - 'apps/control-plane-backend/**'
            fred-sdk:
              - 'libs/fred-sdk/**'
            fred-runtime:
              - 'libs/fred-runtime/**'
            fred-agents:
              - 'apps/fred-agents/**'
            platform-ops:
              - 'libs/capabilities/fred-capability-platform-ops/**'
            html-artifact:
              - 'libs/capabilities/fred-capability-html-artifact/**'
            documents:
              - 'libs/capabilities/fred-capability-documents/**'
            document-access:
              - 'libs/capabilities/fred-capability-document-access/**'
            ppt-filler:
              - 'libs/capabilities/fred-capability-ppt-filler/**'
            team-wiki:
              - 'libs/capabilities/fred-capability-team-wiki/**'
            writable-document:
              - 'libs/capabilities/fred-capability-writable-document/**'
            # Shared CI and Python tooling: a change runs every matrix entry.
            ci:
              - '.github/workflows/Check-pending-requests.yml'
              - '.github/actions/setup-python-env/**'
              - 'ruff.toml'
              - 'scripts/makefiles/**'
            runtime-client:
              - 'apps/frontend/src/slices/runtime/**'
            knowledge-flow-client:
              - 'apps/frontend/src/slices/knowledgeFlow/**'
            control-plane-client:
              - 'apps/frontend/src/slices/controlPlane/**'
            openapi-codegen:
              - 'apps/frontend/Makefile'
              - 'apps/frontend/package.json'
              - 'apps/frontend/package-lock.json'
              - 'apps/frontend/.prettierrc'
              - 'scripts/generate_openapi.py'

      # A skipped matrix entry still waits for a runner, so only affected entries
      # enter the matrices. Triggers list a module's own filter and its editable path dependencies.
      - name: Build the matrices
        id: matrices
        env:
          CHANGED: ${{ steps.changes.outputs.changes }}
        run: |
          set -euo pipefail
          affected() {
            jq -c --argjson changed "$CHANGED" '
              if any($changed[]; . == "ci") then map(del(.triggers))
              else [.[] | select(any(.triggers[]; IN($changed[]))) | del(.triggers)]
              end' "$1"
          }

          cat > "$RUNNER_TEMP/python-modules.json" <<'JSON'
          [
            {"name": "fred-pod", "directory": "libs/fred-pod", "needs-pandoc": false, "integration-target": "",
             "triggers": ["fred-pod"]},
            {"name": "fred-core", "directory": "libs/fred-core", "needs-pandoc": false, "integration-target": "test-integration",
             "triggers": ["fred-core", "fred-pod"]},
            {"name": "knowledge-flow-backend", "directory": "apps/knowledge-flow-backend", "needs-pandoc": true, "integration-target": "",
             "triggers": ["knowledge-flow", "fred-core", "fred-pod"]},
            {"name": "control-plane-backend", "directory": "apps/control-plane-backend", "needs-pandoc": false, "integration-target": "",
             "triggers": ["control-plane", "fred-core", "fred-sdk", "fred-pod"]},
            {"name": "fred-sdk", "directory": "libs/fred-sdk", "needs-pandoc": false, "integration-target": "",
             "triggers": ["fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-runtime", "directory": "libs/fred-runtime", "needs-pandoc": false, "integration-target": "",
             "triggers": ["fred-runtime", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-agents", "directory": "apps/fred-agents", "needs-pandoc": false, "integration-target": "",
             "triggers": ["fred-agents", "platform-ops", "html-artifact", "documents", "document-access", "ppt-filler", "team-wiki", "writable-document", "fred-runtime", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-capability-platform-ops", "directory": "libs/capabilities/fred-capability-platform-ops", "needs-pandoc": false, "integration-target": "",
             "triggers": ["platform-ops", "fred-runtime", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-capability-html-artifact", "directory": "libs/capabilities/fred-capability-html-artifact", "needs-pandoc": false, "integration-target": "",
             "triggers": ["html-artifact", "fred-runtime", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-capability-documents", "directory": "libs/capabilities/fred-capability-documents", "needs-pandoc": false, "integration-target": "",
             "triggers": ["documents", "fred-runtime", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-capability-document-access", "directory": "libs/capabilities/fred-capability-document-access", "needs-pandoc": false, "integration-target": "",
             "triggers": ["document-access", "fred-runtime", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-capability-ppt-filler", "directory": "libs/capabilities/fred-capability-ppt-filler", "needs-pandoc": false, "integration-target": "",
             "triggers": ["ppt-filler", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-capability-team-wiki", "directory": "libs/capabilities/fred-capability-team-wiki", "needs-pandoc": false, "integration-target": "",
             "triggers": ["team-wiki", "fred-runtime", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "fred-capability-writable-document", "directory": "libs/capabilities/fred-capability-writable-document", "needs-pandoc": false, "integration-target": "",
             "triggers": ["writable-document", "fred-runtime", "fred-sdk", "fred-core", "fred-pod"]}
          ]
          JSON

          # A generated client drifts when its backend or the codegen changes, not on any frontend edit.
          cat > "$RUNNER_TEMP/openapi-drift.json" <<'JSON'
          [
            {"name": "runtime", "backend-directory": "libs/fred-runtime", "make-target": "update-runtime-api",
             "slice-path": "apps/frontend/src/slices/runtime/runtimeOpenApi.ts",
             "triggers": ["openapi-codegen", "runtime-client", "fred-runtime", "fred-sdk", "fred-core", "fred-pod"]},
            {"name": "knowledge-flow", "backend-directory": "apps/knowledge-flow-backend", "make-target": "update-knowledge-flow-api",
             "slice-path": "apps/frontend/src/slices/knowledgeFlow/knowledgeFlowOpenApi.ts",
             "triggers": ["openapi-codegen", "knowledge-flow-client", "knowledge-flow", "fred-core", "fred-pod"]},
            {"name": "control-plane", "backend-directory": "apps/control-plane-backend", "make-target": "update-control-plane-api",
             "slice-path": "apps/frontend/src/slices/controlPlane/controlPlaneOpenApi.ts",
             "triggers": ["openapi-codegen", "control-plane-client", "control-plane", "fred-core", "fred-sdk", "fred-pod"]}
          ]
          JSON

          # Assigned first, so a jq failure stops the step instead of emitting an empty list.
          python_modules=$(affected "$RUNNER_TEMP/python-modules.json")
          openapi_drift=$(affected "$RUNNER_TEMP/openapi-drift.json")
          {
            echo "python-modules=$python_modules"
            echo "openapi-drift=$openapi_drift"
          } | tee -a "$GITHUB_OUTPUT"

  # Job to run code quality checks on the affected Python modules
  code-quality:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.python-modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.python-modules) }}
        check:
          - lint
          - format
          - import-order
          - sast
          - detect-secret
          - type-check
    name: Code Quality - ${{ matrix.module.directory }} - ${{ matrix.check }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: ${{ matrix.module.directory }}

      - name: Run ${{ matrix.check }}
        run: |
          cd ${{ matrix.module.directory }}/
          make ${{ matrix.check }}
        env:
          UV: uv

  backend-tests:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.python-modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.python-modules) }}
    name: Backend Tests - ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install system dependencies
        if: ${{ matrix.needs-pandoc }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: ${{ matrix.directory }}

      - name: Run unit tests
        run: make test
        working-directory: ${{ matrix.directory }}
        env:
          UV: uv

      # fred-core only: ReBAC rules are only really covered against a live OpenFGA,
      # which the target starts and stops via docker compose.
      - name: Run integration tests
        if: ${{ matrix.integration-target != '' }}
        timeout-minutes: 15
        run: make ${{ matrix.integration-target }}
        working-directory: ${{ matrix.directory }}
        env:
          UV: uv

  frontend-package-checks:
    runs-on: ubuntu-24.04
    needs: [detect-changes, frontend-package-release-readiness]
    if: needs.detect-changes.outputs.frontend-packages == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install producer dependencies
        run: npm ci
        working-directory: libs/frontend

      - name: Install frontend host-integration dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Provision Chromium
        run: make browser-install
        working-directory: libs/frontend

      - name: Provision isolated consumer cache
        run: make consumer-provision
        working-directory: libs/frontend

      - name: Check producer quality
        run: make code-quality
        working-directory: libs/frontend

      - name: Run producer unit tests
        run: make test
        working-directory: libs/frontend

      - name: Download release-toolchain fixture archives
        uses: actions/download-artifact@v4
        with:
          name: frontend-packages-fixture-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: libs/frontend/target/fixture-transfer

      - name: Validate transferred fixture archives offline
        run: make fixture-transfer-validate
        working-directory: libs/frontend

      - name: Retain fixture validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-packages-fixture-validation-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: libs/frontend/target/fixture-validation/final-evidence.json
          if-no-files-found: error
          retention-days: 7

  frontend-package-release-readiness:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-packages == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup release Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Pin release npm
        run: npm install --global npm@11.19.0

      - name: Install producer dependencies
        run: npm ci
        working-directory: libs/frontend

      - name: Provision isolated consumer cache
        run: make consumer-provision
        working-directory: libs/frontend

      - name: Validate release contracts
        run: make release-check
        working-directory: libs/frontend

      - name: Run controlled release tooling tests
        run: make release-test
        working-directory: libs/frontend

      - name: Preserve package archive regressions
        run: make code-quality test pack-check
        working-directory: libs/frontend

      - name: Create transferable fixture archive set
        run: make fixture-transfer-create
        working-directory: libs/frontend

      - name: Retain release-toolchain fixture archives
        uses: actions/upload-artifact@v4
        with:
          name: frontend-packages-fixture-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: libs/frontend/target/fixture-transfer
          if-no-files-found: error
          retention-days: 7

  # Job to run code quality checks on the frontend
  frontend-code-quality:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: type-check
          - check: format-check
          - check: lint
          # - check: knip
          #   continue-on-error: true
    name: Code Quality - frontend - ${{ matrix.check }}
    continue-on-error: ${{ matrix.continue-on-error == true }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Run ${{ matrix.check }}
        run: |
          cd apps/frontend/
          make ${{ matrix.check }}

  # Job to check the frontend
  frontend-checks:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Frontend build
        run: |
          cd apps/frontend/
          make build

      - name: Frontend run
        run: |
          cd apps/frontend/
          timeout 30s make run || true

  # Job to check helm charts
  deploy-charts-checks:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-chart == 'true'

    steps:
      - name: Checkout charts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check chart - Fred
        run: |
          helm template fred deploy/charts/fred \
            --set-string applications.fred-agents.image.tag=swift-dev \
            --set-string applications.knowledge-flow-backend.image.tag=swift-dev \
            --set-string applications.knowledge-flow-worker.image.tag=swift-dev \
            --set-string applications.control-plane-backend.image.tag=swift-dev \
            --set-string applications.control-plane-worker.image.tag=swift-dev \
            --set-string applications.frontend.image.tag=swift-dev

      - name: Check chart - knowledge-flow ingestion worker groups
        run: make check-chart-ingestion-workers

      - name: Check chart - root bootstrap secret contract (AUTHZ-07)
        run: |
          set -euo pipefail

          # No overlay reference configured: the chart's own default must never
          # inject FRED_BOOTSTRAP_TOKEN (root bootstrap stays explicitly unavailable).
          helm template fred deploy/charts/fred \
            --set-string applications.control-plane-backend.image.tag=swift-dev \
            > /tmp/rendered-default.yaml
          if grep -q "name: FRED_BOOTSTRAP_TOKEN" /tmp/rendered-default.yaml; then
            echo "FAIL: FRED_BOOTSTRAP_TOKEN must not be injected with no overlay reference configured"
            exit 1
          fi

          # An overlay-supplied Secret reference must render as a bare secretKeyRef,
          # fail-closed (optional: false), never a literal value, never bootstrap_token_file.
          # Migration Job is enabled here too, so this one render also proves
          # extraEnvVars stays a Deployment-only extension point (never copied
          # into the Alembic migration Job, which only needs .app.env).
          helm template fred deploy/charts/fred \
            --set-string applications.control-plane-backend.image.tag=swift-dev \
            --set applications.control-plane-backend.migration.enabled=true \
            --set-string applications.control-plane-backend.extraEnvVars[0].name=FRED_BOOTSTRAP_TOKEN \
            --set-string applications.control-plane-backend.extraEnvVars[0].valueFrom.secretKeyRef.name=fake-foundation-secret \
            --set-string applications.control-plane-backend.extraEnvVars[0].valueFrom.secretKeyRef.key=bootstrap-token \
            --set applications.control-plane-backend.extraEnvVars[0].valueFrom.secretKeyRef.optional=false \
            > /tmp/rendered-bootstrap.yaml

          grep -q "secretKeyRef:" /tmp/rendered-bootstrap.yaml
          grep -A5 "name: FRED_BOOTSTRAP_TOKEN" /tmp/rendered-bootstrap.yaml | grep -q "optional: false"
          if grep -q "bootstrap_token_file" /tmp/rendered-bootstrap.yaml; then
            echo "FAIL: bootstrap_token_file must never be rendered into a Kubernetes manifest"
            exit 1
          fi
          if grep -qE "value: .*fake-foundation-secret.*\bbootstrap-token\b" /tmp/rendered-bootstrap.yaml; then
            echo "FAIL: a literal bootstrap secret value leaked into a rendered manifest"
            exit 1
          fi

          # bootstrap_token_env_var (Control Plane's own config) must name the exact
          # same variable the Deployment injects — one canonical variable, not two.
          grep -q "bootstrap_token_env_var: FRED_BOOTSTRAP_TOKEN" /tmp/rendered-bootstrap.yaml

          # Only control-plane-backend's Deployment env may receive the token; no
          # other app/worker, and no migration Job, gets it (this render has the
          # migration Job enabled — see above).
          env_entries=$(grep -c "^\s*- name: FRED_BOOTSTRAP_TOKEN$" /tmp/rendered-bootstrap.yaml)
          if [ "$env_entries" -ne 1 ]; then
            echo "FAIL: expected exactly one FRED_BOOTSTRAP_TOKEN env entry, found $env_entries"
            exit 1
          fi

          # Per-document proof of *which* object owns that single entry: the
          # Deployment, never the migration Job.
          awk -v RS='\n---\n' '
            /kind: Job/ && /name: control-plane-backend-migration-/ && /FRED_BOOTSTRAP_TOKEN/ {
              print "FAIL: FRED_BOOTSTRAP_TOKEN leaked into the control-plane-backend migration Job"; err=1
            }
            /kind: Deployment/ && /app: control-plane-backend/ {
              seen=1
              if (!/FRED_BOOTSTRAP_TOKEN/) { print "FAIL: FRED_BOOTSTRAP_TOKEN missing from the control-plane-backend Deployment"; err=1 }
            }
            END { if (!seen) { print "FAIL: control-plane-backend Deployment document not found"; err=1 } exit err+0 }
          ' /tmp/rendered-bootstrap.yaml

          echo "Rendered bootstrap-secret contract checks passed."

  # Job to check fred-agents app startup
  fred-agents-checks:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.python-modules).*.name, 'fred-agents')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: apps/fred-agents

      - name: Test backend startup
        run: |
          cd apps/fred-agents/
          timeout 30s make run || true

  # Job for knowledge-flow
  knowledge-flow-backend-checks:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.python-modules).*.name, 'knowledge-flow-backend')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: apps/knowledge-flow-backend

      - name: Check route security
        run: |
          cd apps/knowledge-flow-backend/
          make check-route-security

      - name: Build and test
        run: |
          cd apps/knowledge-flow-backend/
          timeout 30s make run || true

  # Job to check control-plane backend
  control-plane-backend-checks:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.python-modules).*.name, 'control-plane-backend')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: apps/control-plane-backend

      - name: Check route security
        run: |
          cd apps/control-plane-backend/
          make check-route-security

      - name: Test backend startup
        run: |
          cd apps/control-plane-backend/
          timeout 30s make run || true

  # Job to check OpenAPI spec drift when a backend or its generated client changes
  openapi-drift-check:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.openapi-drift != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.openapi-drift) }}
    name: OpenAPI Drift - ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Setup backend dependencies
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: ${{ matrix.backend-directory }}

      - name: Backup current slice
        run: cp -f ${{ matrix.slice-path }} /tmp/openapi-backup.ts 2>/dev/null || true

      - name: Regenerate OpenAPI slice
        run: |
          cd apps/frontend/
          make ${{ matrix.make-target }}
        env:
          UV: uv

      - name: Check for drift
        run: |
          if ! diff -q /tmp/openapi-backup.ts ${{ matrix.slice-path }} > /dev/null 2>&1; then
            echo "--- diff (committed vs freshly generated) ---"
            diff -u /tmp/openapi-backup.ts ${{ matrix.slice-path }} || true
            echo "❌ DRIFT DETECTED: ${{ matrix.name }} OpenAPI slice has changed but wasn't updated in the PR"
            echo "Please run 'make ${{ matrix.make-target }}' in apps/frontend/ and commit the changes"
            exit 1
          fi
          echo "✅ ${{ matrix.name }} OpenAPI slice is up to date"
