name: Check docker images

# No paths filter on purpose: an image breaks from far outside its own directory
# — a libs/ package added as a path dependency but never COPYed is exactly the
# release-blocking bug this gate exists to catch.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push supersedes the run it interrupts: keep only the latest commit of a
# branch under check, so a work-in-progress series does not queue several full
# job sets against the same runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-images:
    uses: ./.github/workflows/Docker-images.yml
    with:
      publish: false
