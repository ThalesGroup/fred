name: Check docker images

# Build and scan on every PR: changes outside dependency files can still alter
# an image or break a Docker COPY.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A pull request only needs its newest commit checked, so a push supersedes the
# run it interrupts. A base-branch commit groups by sha instead: it keeps its own
# run and its own verdict, and never waits behind the commit before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker-images:
    uses: ./.github/workflows/Docker-images.yml
    with:
      publish: false
