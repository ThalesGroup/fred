name: Check docker images

# Keep the PR trigger unfiltered so changes outside an image's directory can
# still expose a missing Docker COPY. The reusable workflow selects affected
# builds; a manual run builds all images.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A pull request only needs its newest commit checked, so a push supersedes the
# run it interrupts. A base-branch commit groups by sha instead: it keeps its own
# run and its own verdict, and never waits behind the commit before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker-images:
    uses: ./.github/workflows/Docker-images.yml
    with:
      publish: false
