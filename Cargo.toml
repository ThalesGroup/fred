[workspace]
resolver = "3"
members = [
    "apps/control-plane",
    "apps/monitor",
    "libs/fred-rust-agent",
    "libs/fred-rust-sdk",
]
default-members = ["apps/control-plane"]

[workspace.package]
version = "5.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
fred-rust-sdk = { path = "libs/fred-rust-sdk" }
anyhow = "1.0.104"
axum = "0.8"
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v5"] }
utoipa = "6.0"

# Test-only RSA key generation is unusably slow unoptimized.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
