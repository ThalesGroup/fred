<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Progress Tracker</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 20px; background: transparent; }
      h1 { font-size: 1.15rem; margin: 0 0 2px; }
      .sub { color: #777; font-size: 0.82rem; margin-bottom: 18px; }
      form { display: flex; gap: 8px; margin-bottom: 18px; }
      input { flex: 1; padding: 7px 10px; border: 1px solid #8884; border-radius: 6px;
              background: transparent; color: inherit; font: inherit; }
      button { padding: 7px 14px; border: 0; border-radius: 6px; background: #2563eb;
               color: #fff; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .task { border: 1px solid #8883; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
      .row { display: flex; align-items: baseline; gap: 10px; }
      .handle { font-family: ui-monospace, monospace; font-size: 0.8rem; color: #2563eb; }
      .title { font-weight: 600; }
      .pill { margin-left: auto; font-size: 0.72rem; padding: 2px 9px; border-radius: 999px; }
      .open { background: #64748b22; color: #64748b; }
      .decided { background: #16a34a22; color: #16a34a; }
      .meta { font-size: 0.76rem; color: #888; margin-top: 6px; }
      .decisions { margin: 8px 0 0; padding-left: 16px; font-size: 0.82rem; }
      .decisions li { margin-bottom: 3px; }
      .q { color: #888; }
      #err { color: #dc2626; font-size: 0.85rem; }
      .empty { color: #888; font-size: 0.88rem; }
    </style>
  </head>
  <body>
    <h1>Progress Tracker</h1>
    <div class="sub" id="ctx">connecting…</div>

    <form id="new">
      <input id="title" placeholder="What needs tracking?" maxlength="200" required />
      <button type="submit">Add task</button>
    </form>

    <div id="err"></div>
    <div id="list"></div>

    <script>
      // Frame side of the Fred application protocol. This page holds no token
      // and names no upstream: every call is asked of the host, which attaches
      // the caller's bearer and routes to this application's own service.
      const PROTOCOL_VERSION = "1";
      const pending = new Map();
      let seq = 0;
      let teamId = null;

      const post = (msg) => parent.postMessage(msg, "*");

      // The host prefixes /app-services/<app>/teams/<team> itself, so a path
      // here is relative to that root — never repeat the team segment.
      function hostFetch(path, init = {}) {
        // A fresh id per request: the host bounds concurrency per id, and
        // reusing one would collide with a request still in flight.
        const requestId = `r${++seq}`;
        post({
          type: "fred:request",
          requestId,
          path,
          method: init.method || "GET",
          headers: init.body ? { "content-type": "application/json" } : {},
          body: init.body || null,
        });
        return new Promise((resolve, reject) => {
          pending.set(requestId, { resolve, reject });
          setTimeout(() => {
            if (pending.delete(requestId)) reject(new Error("timed out"));
          }, 15000);
        });
      }

      window.addEventListener("message", (event) => {
        const m = event.data;
        if (!m || typeof m !== "object") return;

        if (m.type === "fred:context") {
          teamId = m.context?.team?.id ?? null;
          document.getElementById("ctx").textContent =
            `${m.context?.team?.name ?? "team"} · protocol v${m.protocolVersion}`;
          load();
          return;
        }
        const entry = pending.get(m.requestId);
        if (!entry) return;
        pending.delete(m.requestId);
        if (m.type === "fred:response-error") return entry.reject(new Error("request failed"));
        if (m.type !== "fred:response") return;
        if (m.status >= 200 && m.status < 300) {
          try { entry.resolve(m.body ? JSON.parse(m.body) : null); }
          catch { entry.reject(new Error("bad JSON")); }
        } else {
          entry.reject(new Error(`HTTP ${m.status}`));
        }
      });

      function render(items) {
        const list = document.getElementById("list");
        if (!items.length) {
          list.innerHTML = '<div class="empty">No tasks yet. Add one, then discuss it with an agent in chat.</div>';
          return;
        }
        list.innerHTML = items.map((t) => {
          const decisions = (t.decisions || [])
            .map((d) => `<li><span class="q">${esc(d.question)}</span> → ${esc(d.answer)}</li>`)
            .join("");
          const convos = (t.session_ids || []).length;
          return `
            <div class="task">
              <div class="row">
                <span class="handle">${esc(t.handle)}</span>
                <span class="title">${esc(t.title)}</span>
                <span class="pill ${t.stage === "decided" ? "decided" : "open"}">${esc(t.stage)}</span>
              </div>
              ${decisions ? `<ul class="decisions">${decisions}</ul>` : ""}
              <div class="meta">
                ${(t.notes || []).length} note(s) ·
                ${convos} conversation(s) · updated ${esc(t.updated_at || "")}
              </div>
            </div>`;
        }).join("");
      }

      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      async function load() {
        if (!teamId) return;
        try {
          const data = await hostFetch("tasks");
          document.getElementById("err").textContent = "";
          render(data.items || []);
        } catch (e) {
          document.getElementById("err").textContent = `Could not load tasks: ${e.message}`;
        }
      }

      document.getElementById("new").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = document.getElementById("title");
        const title = input.value.trim();
        if (!title || !teamId) return;
        try {
          await hostFetch("tasks", {
            method: "POST",
            body: JSON.stringify({ title }),
          });
          input.value = "";
          load();
        } catch (e) {
          document.getElementById("err").textContent = `Could not add task: ${e.message}`;
        }
      });

      // No push channel exists, so progress made in chat arrives by polling.
      setInterval(load, 10000);

      // Announce last: the host replies with fred:context, which starts the load.
      post({ type: "fred:ready", protocolVersion: PROTOCOL_VERSION });
    </script>
  </body>
</html>
