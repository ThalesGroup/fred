# The sample's own workloads, in their own namespace.
#
# Nothing here is special to Fred: two ordinary Deployments and Services. Fred
# reaches them only by the Service DNS names given in FRONTEND_APPLICATIONS_JSON,
# which is why an application can live in any namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: sample-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-tracker-ui
  namespace: sample-apps
  labels: { app: progress-tracker-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: progress-tracker-ui }
  template:
    metadata:
      labels: { app: progress-tracker-ui }
    spec:
      containers:
        - name: ui
          image: progress-tracker-ui:sample
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: progress-tracker-ui
  namespace: sample-apps
spec:
  selector: { app: progress-tracker-ui }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-tracker-api
  namespace: sample-apps
  labels: { app: progress-tracker-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: progress-tracker-api }
  template:
    metadata:
      labels: { app: progress-tracker-api }
    spec:
      containers:
        - name: api
          image: progress-tracker-api:sample
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            # Fully qualified: this service lives in another namespace, and the
            # entitlement check must reach Fred's control plane.
            - name: CONTROL_PLANE_BASE
              value: http://control-plane-backend.fred.svc.cluster.local:8222
            # Shared with the agents pod so the capability can call this API
            # as itself. This sample's own stopgap, not a Fred mechanism -- see
            # README.md before reusing the idea.
            - name: PROGRESS_TRACKER_SERVICE_KEY
              valueFrom:
                secretKeyRef: { name: progress-tracker-service, key: key }
            # Read-only: used to show the conversations pinned to a task. The
            # caller's own bearer is forwarded, so this reads no one else's chat.
            - name: RUNTIME_BASE
              value: http://fred-agents.fred.svc.cluster.local:80/fred/agents/v2
            - name: OPENSEARCH_URL
              value: https://opensearch.fred.svc.cluster.local:9200
            # Secrets are namespace-scoped, so this namespace holds its own.
            # Never commit the value; create the secret out of band (README).
            - name: OPENSEARCH_USER
              valueFrom:
                secretKeyRef: { name: progress-tracker-opensearch, key: username }
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef: { name: progress-tracker-opensearch, key: password }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: progress-tracker-api
  namespace: sample-apps
spec:
  selector: { app: progress-tracker-api }
  ports: [{ port: 8000, targetPort: 8000 }]
