apiVersion: apps/v1
kind: Deployment
metadata:
  name: fred-sandbox-broker
  namespace: fred-sandbox-system
spec:
  template:
    spec:
      containers:
        - name: broker
          env:
            - name: SANDBOX_MOUNT_PROVIDER
              value: rclone_csi
            - name: SANDBOX_FILE_STORAGE_CLASS
              value: fred-sandbox-webdav
            - name: SANDBOX_FILE_GATEWAY_URL
              value: REPLACE_WITH_HTTPS_KNOWLEDGE_FLOW_SANDBOX_MOUNT_URL
            - name: SANDBOX_FILE_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: fred-sandbox-file-gateway
                  key: secret
            - name: SANDBOX_AGENT_POOL_NAME
              value: fred-code-files
