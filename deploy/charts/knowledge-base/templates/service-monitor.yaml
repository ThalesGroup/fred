{{- $ports := include "knowledge-base.metricsPorts" . | fromYamlArray -}}
{{- $monitor := .Values.metricsService.serviceMonitor -}}
{{- if and .Values.metricsService.enabled $monitor.enabled $ports }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "knowledge-base.fullname" . }}-metrics
  labels:
    {{- include "knowledge-base.labels" . | nindent 4 }}
    {{- with $monitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $monitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "knowledge-base.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/part-of: metrics
  endpoints:
    {{- range $ports }}
    - port: {{ .name }}
      path: {{ $monitor.path }}
      interval: {{ $monitor.interval }}
      scrapeTimeout: {{ $monitor.scrapeTimeout }}
      {{- with $monitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $monitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
