# Configuration fragment, not a complete deployment overlay. Helm replaces lists:
# preserve every SQL/identity/model entry and volume already in your deployment.
# See fred-deployment-factory's k3d-apps/fred/values-weaver.yaml for a complete profile.
# Use the same documents bucket as document-storage.yaml; grant only output
# writes to the worker and input writes plus input/output reads to Control Plane.
# Knowledge Flow reads the published generation using the configured artifact credentials.
applications:
  control-plane-backend:
    extraEnvVars:
      - name: FRED_CONTENT_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: manager-document-storage, key: access-key}
      - name: FRED_CONTENT_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: manager-document-storage, key: secret-key}
      - name: MANAGER_DERIVED_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: manager-processing, key: access-key}
      - name: MANAGER_DERIVED_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: manager-processing, key: secret-key}
    # The chart exports the contract from the worker's image, in an init container.
    workerContract: {exportFromWorkerImage: true}
    configuration:
      scheduler:
        processing:
          enabled: true
          worker_contract_file: /app/processing-contract/worker-contract.json
          temporal:
            host: temporal:7233
            namespace: default
            task_queue: ingestion
          worker:
            issuer: https://identity.example.test/realms/app
            audience: control-plane
            client_id: knowledge-flow-worker
          derived:
            endpoint: https://s3.example.test
            bucket: app-content-documents
            prefix: ""
            access_key_env_var: MANAGER_DERIVED_ACCESS_KEY
            secret_key_env_var: MANAGER_DERIVED_SECRET_KEY
  # control-plane-worker retains its SQL environment; no S3 secret or contract mount.
  knowledge-flow-worker:
    extraEnvVars:
      - name: MANAGER_WORKER_CLIENT_SECRET
        valueFrom:
          secretKeyRef: {name: manager-processing, key: worker-client-secret}
      - name: MANAGER_DERIVED_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: manager-processing, key: access-key}
      - name: MANAGER_DERIVED_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: manager-processing, key: secret-key}
    configuration:
      scheduler:
        enabled: true
        backend: temporal
        temporal:
          host: temporal:7233
          namespace: default
          task_queue: ingestion
          ingestion_max_concurrent_activities: 1
      manager_processing:
        url: https://manager.example.test/control-plane/v1
        issuer: https://identity.example.test/realms/app
        audience: control-plane
        client_id: knowledge-flow-worker
        endpoint: https://s3.example.test
        bucket: app-content-documents
        vector_store:
          type: opensearch
          index: document-vectors
        temporary_bytes: 1073741824
    resources:
      requests:
        ephemeral-storage: 5Gi
      limits:
        ephemeral-storage: 8Gi

  knowledge-flow-backend:
    extraEnvVars:
      - name: MANAGER_DERIVED_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: manager-processing, key: access-key}
      - name: MANAGER_DERIVED_SECRET_KEY
        valueFrom:
          secretKeyRef: {name: manager-processing, key: secret-key}
    configuration:
      control_plane_url: https://manager.example.test/control-plane/v1
      published_artifacts:
        endpoint: https://s3.example.test
        bucket: app-content-documents
        access_key_env: MANAGER_DERIVED_ACCESS_KEY
        secret_key_env: MANAGER_DERIVED_SECRET_KEY
      storage:
        vector_store:
          type: opensearch
          collection_name: null
          index: document-vectors
