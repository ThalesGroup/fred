{{- $legacy := lookup "apps/v1" "Deployment" .Release.Namespace "fred-manager" }}
{{- if and $legacy (ne (index ($legacy.metadata.annotations | default dict) "meta.helm.sh/release-name") .Release.Name) }}
{{- fail "A separate fred-manager deployment still exists. Retire its application release explicitly before deploying the Rust control-plane; preserve infrastructure and data." }}
{{- end }}
{{- include "fred.validate-ingestion-worker-roles" $ }}
{{- range $name, $rawApp := .Values.applications }}
  {{- $app := deepCopy $rawApp }}
  {{- if hasKey $rawApp "inheritFrom" }}
    {{- $app = include "fred.resolvedApp" (dict "app" $rawApp "root" $ "name" $name) | fromYaml }}
  {{- end }}
  {{- if or (eq $name "control-plane-backend") (eq $name "control-plane-worker") }}
    {{- $_ := set $app "configuration" (include "fred.managerConfiguration" $ | fromYaml) }}
  {{- end }}
  {{- $appEnabled := true }}
  {{- if hasKey $app "enabled" }}
    {{- $appEnabled = $app.enabled }}
  {{- end }}
  {{- if $appEnabled }}
  {{- $ctx := dict "app" $app "root" $ }}
  {{- include "common-library.service" $ctx }}
  {{- include "common-library.service-metrics" $ctx }}
  {{- include "common-library.service-monitor" $ctx }}
  {{- include "common-library.serviceaccount" $ctx }}
  {{- include "common-library.ingress" $ctx }}
  {{- include "common-library.http-route" $ctx }}
  {{- include "common-library.rbac" $ctx }}
  {{- include "common-library.configmap-frontend" $ctx }}
  {{- include "common-library.configmap-kube" $ctx }}
  {{- include "common-library.configmap-backend" $ctx }}
  {{- include "common-library.configmap-catalog" $ctx }}
  {{- include "common-library.pvc_pv" $ctx }}
  {{- include "common-library.deployment" $ctx }}
  {{- include "common-library.secrets-env" $ctx }}
  {{- include "common-library.job" $ctx }}
  {{- include "common-library.hook-migration-rbac" $ctx }}
  {{- include "common-library.hook-scale-down" $ctx }}
  {{- include "common-library.hook-migration" $ctx }}
  {{- end }}
{{- end }}
