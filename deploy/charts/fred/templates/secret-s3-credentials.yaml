{{- $controlPlane := index .Values.applications "control-plane-backend" -}}
{{- $contentStorage := $controlPlane.configuration.storage.content_storage | default dict -}}
{{- $accessKey := $contentStorage.access_key | default "" -}}
{{- $secretKey := $controlPlane.dotenv.MINIO_SECRET_KEY | default "" -}}
{{- if and $accessKey $secretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  MINIO_ACCESS_KEY: {{ $accessKey | quote }}
  MINIO_SECRET_KEY: {{ $secretKey | quote }}
{{- end }}
