{{- $controlPlane := index .Values.applications "control-plane-backend" -}}
{{- $frontend := index .Values.applications "frontend" -}}
{{- $contentStorage := $controlPlane.configuration.storage.content_storage | default dict -}}
{{- $accessKey := $contentStorage.access_key | default "" -}}
{{- $secretKey := $controlPlane.dotenv.MINIO_SECRET_KEY | default "" -}}
{{- $themeURLConfigured := false -}}
{{- range ($frontend.extraEnvVars | default list) -}}
  {{- if and (eq .name "FRONTEND_THEME_URL") (or (.value | default "") (hasKey . "valueFrom")) -}}
    {{- $themeURLConfigured = true -}}
  {{- end -}}
{{- end -}}
{{- if and $frontend.enabled $themeURLConfigured $accessKey $secretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  MINIO_ACCESS_KEY: {{ $accessKey | quote }}
  MINIO_SECRET_KEY: {{ $secretKey | quote }}
{{- end }}
