{{- define "common-library.deployment" }}

{{- if .app.deployment.enabled }}

{{- $persistenceEnabled := .root.Values.global.persistence.enabled }}   # we will use it in a loop
{{- $applicationName := .app.applicationName }}                         # we will use it in a loop
{{- $isFrontend := eq .app.applicationName "frontend" }}
{{- $isFredAgents := eq .app.applicationName "fred-agents" }}
{{- $replicaCount := dig "replicaCount" 1 .app | int }}
{{- $maxReplicas := $replicaCount }}
{{- if and .app.autoscaling .app.autoscaling.enabled }}
{{- $maxReplicas = .app.autoscaling.maxReplicas | int }}
{{- end }}
{{- $configuration := .app.configuration | default dict }}
{{- $exportsWorkerContract := and (eq .app.applicationName "control-plane-backend") (dig "workerContract" "exportFromWorkerImage" false .app) }}
{{- $runtimeFilesystemType := dig "storage" "object_store" "type" "local" $configuration }}
{{- if and $isFredAgents (gt $maxReplicas 1) (eq $runtimeFilesystemType "local") }}
{{- fail "applications.fred-agents.configuration.storage.object_store must select a shared backend (gcs or minio) when replicaCount or enabled autoscaling maxReplicas is greater than 1" }}
{{- end }}
{{- /* The control-plane flag is the sole chart input; its derived frontend env is emitted after env/extraEnvVars so it remains authoritative. */}}
{{- $controlPlane := (index .root.Values.applications "control-plane-backend") | default dict }}
{{- $enableApplications := dig "configuration" "platform" "frontend" "feature_flags" "enableApplications" false $controlPlane }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .app.applicationName }}
  labels:
    app: {{ .app.applicationName }}
spec:
  {{- if not (and .app.autoscaling .app.autoscaling.enabled) }}
  replicas: {{ $replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .app.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .app.rollingUpdate.maxUnavailable }}
  revisionHistoryLimit: {{ .app.revisionHistoryLimit | default 2 }}
  selector:
    matchLabels:
      app: {{ .app.applicationName }}
  template:
    metadata:
      annotations:
        {{- if .app.podAnnotations }}
{{ toYaml .app.podAnnotations | nindent 8 }}
        {{- end }}
        {{- if and .app.metricsService .app.metricsService.enabled (not (and .app.metricsService.serviceMonitor .app.metricsService.serviceMonitor.enabled)) }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .app.metricsService.targetPort }}"
        prometheus.io/path: "/metrics"
        {{- end }}
        # BEGIN - Force refresh of the deployment when configmap is changed
        {{- if or (eq $applicationName "control-plane-backend") (eq $applicationName "control-plane-worker") }}
        {{- $manager := index .root.Values.applications "control-plane-backend" }}
        configmap.configurations.checksum: {{ include "fred.managerConfiguration" .root | fromYaml | toJson | sha256sum | quote }}
        configmap.catalog.checksum: {{ $manager.lifecycle_policy_catalog | toJson | sha256sum | quote }}
        {{- else if .app.configuration }}
        configmap.configurations.checksum: "{{ .app.configuration | join "," | sha256sum }}"
        {{- end }}
        {{- if $exportsWorkerContract }}
        {{- $worker := index .root.Values.applications "knowledge-flow-worker" }}
        configmap.worker-contract.checksum: {{ list $worker.image $worker.configuration | toJson | sha256sum | quote }}
        {{- end }}
        {{- if .app.kubeconfig.enabled }}
        configmap.kubeconfig.checksum: "{{ .root.Values.global.kubeconfig | join "," | sha256sum }}"
        {{- end }}
        # END - Force refresh of the deployment when configmap is changed
      labels:
        app: {{ .app.applicationName }}
    spec:
      {{- with .app.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if .app.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .app.imagePullSecrets | nindent 8 }}
      {{- end }}

      {{- if .app.serviceAccount.enabled }}
      serviceAccount: {{ .app.serviceAccount.name }}
      serviceAccountName: {{ .app.serviceAccount.name }}
      {{- end }}

      {{- with .app.podSecurityContext }}
      securityContext:
{{ toYaml . | nindent 8 }}
      {{- end }}

      {{- if $exportsWorkerContract }}
      {{- $worker := index .root.Values.applications "knowledge-flow-worker" }}
      initContainers:
        # What the worker accepts comes from the worker's own image and configuration,
        # so the two cannot disagree. No credential: this container reads no Secret.
        - name: worker-contract
          image: "{{ $worker.image.repository }}:{{ $worker.image.tag | default .root.Chart.AppVersion }}"
          imagePullPolicy: {{ default "IfNotPresent" $worker.image.pullPolicy }}
          command: [sh, -ec]
          args:
            - python -m knowledge_flow_worker.features.scheduler.export_contract --configuration /worker-config/configuration.yaml > /app/processing-contract/worker-contract.json
          volumeMounts:
            - {name: worker-config, mountPath: /worker-config, readOnly: true}
            - {name: processing-contract, mountPath: /app/processing-contract}
      {{- end }}

      containers:
        - name: {{ .app.applicationName }}
          image: "{{ .app.image.repository }}:{{ .app.image.tag | default .root.Chart.AppVersion }}"
          imagePullPolicy: {{ default "IfNotPresent" .app.image.pullPolicy }}

          {{- with .app.securityContext }}
          securityContext:
{{ toYaml . | nindent 12 }}
          {{- end }}

          {{- if .app.ports }}
          ports:
          {{- range .app.ports }}
            - containerPort: {{ .containerPort }}
              {{- if .name }}
              name: {{ .name }}
              {{- end }}
          {{- end }}
          {{- end }}

          {{- if .app.command.enabled }}
          command:
{{ toYaml .app.command.data | nindent 12 }}
          {{- end }}

          {{- if or .app.env .app.extraEnvVars $isFrontend }}
          env:
            {{- if .app.env }}
{{ toYaml .app.env | nindent 12 }}
            {{- end }}
            {{- if .app.extraEnvVars }}
{{ toYaml .app.extraEnvVars | nindent 12 }}
            {{- end }}
            {{- if $isFrontend }}
            {{- /* Variable proxy_pass uses nginx DNS, without the pod's search domains.
                  Supply chart defaults outside env: instance overlays replace that list. */}}
            {{- $providedEnv := dict }}
            {{- range concat (.app.env | default list) (.app.extraEnvVars | default list) }}
              {{- $_ := set $providedEnv .name true }}
            {{- end }}
            {{- $managerUpstream := printf "http://control-plane-backend.%s.svc.cluster.local:8222" .root.Release.Namespace }}
            {{- range $name := list "FRONTEND_CONTROL_PLANE_UPSTREAM" }}
            {{- if not (hasKey $providedEnv $name) }}
            - name: {{ $name }}
              value: {{ $managerUpstream | quote }}
            {{- end }}
            {{- end }}
            {{- if not (hasKey $providedEnv "FRONTEND_KNOWLEDGE_FLOW_UPSTREAM") }}
            - name: FRONTEND_KNOWLEDGE_FLOW_UPSTREAM
              value: {{ printf "http://knowledge-flow-backend.%s.svc.cluster.local:8000" .root.Release.Namespace | quote }}
            {{- end }}
            {{- if not (hasKey $providedEnv "FRONTEND_MONITOR_UPSTREAM") }}
            - name: FRONTEND_MONITOR_UPSTREAM
              value: {{ printf "http://monitor.%s.svc.cluster.local:8223" .root.Release.Namespace | quote }}
            {{- end }}
            - name: FRONTEND_ENABLE_APPLICATIONS
              value: {{ ternary "true" "false" $enableApplications | quote }}
            - name: FRONTEND_APPLICATIONS_JSON
              value: {{ (include "fred.registrations" .root | fromYaml).gateways | toJson | quote }}
            {{- end }}
            {{- if eq $applicationName "monitor" }}
            {{- $user := $controlPlane.configuration.security.user }}
            {{- $provided := dict }}
            {{- range concat (.app.env | default list) (.app.extraEnvVars | default list) }}
              {{- $_ := set $provided .name true }}
            {{- end }}
            {{- $defaults := dict "OIDC_ISSUER" $user.realm_url "OIDC_CLIENT_ID" $user.client_id "OIDC_AUDIENCE" ($user.audience | default $user.client_id) "OIDC_PROVIDER" ($user.provider | default "keycloak") }}
            {{- if $user.jwks_url }}{{- $_ := set $defaults "OIDC_JWKS_URL" $user.jwks_url }}{{- end }}
            {{- range $name, $value := $defaults }}
            {{- if not (hasKey $provided $name) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}

          {{- if .app.envFrom }}
          envFrom:
{{ toYaml .app.envFrom | nindent 12 }}
          {{- end }}

          {{- if .app.probes.livenessProbe.enabled }}
          livenessProbe:
{{ toYaml .app.probes.livenessProbe.data | nindent 12 }}
          {{- end }}

          {{- if .app.probes.readinessProbe.enabled }}
          readinessProbe:
{{ toYaml .app.probes.readinessProbe.data | nindent 12 }}
          {{- end }}

          {{- if .app.probes.startupProbe.enabled }}
          startupProbe:
{{ toYaml .app.probes.startupProbe.data | nindent 12 }}
          {{- end }}

          volumeMounts:
          {{- if $exportsWorkerContract }}
            - {name: processing-contract, mountPath: /app/processing-contract, readOnly: true}
          {{- end }}
          {{- if eq .app.applicationName "control-plane-backend" }}
          {{- with $configuration.storage.content }}
            - name: manager-document-spool
              mountPath: {{ .temp_dir | default "/tmp/control-plane-uploads" | quote }}
          {{- end }}
          {{- end }}
{{ toYaml .app.volumeMounts| nindent 12 }}
          {{- if and .app.extraVolumeMounts (gt (len .app.extraVolumeMounts) 0) }}
{{ toYaml .app.extraVolumeMounts| nindent 12 }}
          {{- end }}

          {{- range $name, $store := $configuration.storage }}
            {{- $isDuckDB := and (hasSuffix "_store" $name) (eq $store.type "duckdb") }}

              {{- if and $isDuckDB $persistenceEnabled }}
            - name: {{ $applicationName }}-{{ regexReplaceAll "_" $name "-" }}-pvc
              mountPath: {{ dir $store.duckdb_path }}
              subPath: "{{ base $store.duckdb_path }}"
              {{- end }}
            
          {{- end }}


          {{- with .app.resources }}
          resources:
{{ toYaml . | nindent 12 }}
          {{- end }}

      {{- if .app.priorityClass }}
      priorityClassName: {{ .app.priorityClass.name }}
      {{- end }}

      volumes:
      {{- if eq .app.applicationName "control-plane-backend" }}
      {{- with $configuration.storage.content }}
        - name: manager-document-spool
          emptyDir:
            sizeLimit: {{ (get (.limits | default dict) "temp_bytes") | default 838860800 | int64 | printf "%d" | quote }}
      {{- end }}
      {{- end }}
      {{- if $exportsWorkerContract }}
        - name: worker-config
          configMap: {name: {{ (index .root.Values.applications "knowledge-flow-worker").applicationName }}-back}
        - name: processing-contract
          emptyDir: {}
      {{- end }}
{{ toYaml .app.volumes | nindent 8 }}
      {{- if and .app.extraVolumes (gt (len .app.extraVolumes) 0) }}
{{ toYaml .app.extraVolumes | nindent 8 }}
      {{- end }}


        {{- range $name, $store := $configuration.storage }}
          {{- $isDuckDB := and (hasSuffix "_store" $name) (eq $store.type "duckdb") }}
          {{- if and $isDuckDB $persistenceEnabled }}
        - name: {{ $applicationName }}-{{ regexReplaceAll "_" $name "-" }}-pvc
          persistentVolumeClaim:
            claimName: {{ $applicationName }}-{{ regexReplaceAll "_" $name "-" }}-pvc
          {{- end }}
        {{- end }}


      {{- with .app.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
      {{- end }}

      {{- with .app.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
      {{- end }}

      {{- with .app.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
      {{- end }}

{{- end }}

{{ end -}}
