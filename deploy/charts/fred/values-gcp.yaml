# =============================================================================
# GKE (Autopilot) overlay — native Google Cloud Storage via Workload Identity.
# =============================================================================
#
# Auth model: Application Default Credentials (ADC) through Workload Identity.
# NO service-account JSON key is committed or mounted.
#
# ⚠️ DEEP-MERGE CAVEAT (read before `helm -f`):
# The `gcs` storage schema forbids extra keys (additionalProperties: false). If
# you layer this file on top of values.yaml with `helm -f values.yaml -f values-gcp.yaml`,
# Helm DEEP-MERGES maps, so the base `content_storage.root_path` / `filesystem`
# minio keys would remain and FAIL schema validation. Therefore the storage
# blocks below are meant to REPLACE the base ones: either
#   (a) edit the `x-kf-content-storage` / `x-kf-filesystem` / `x-kf-storage` /
#       `x-cp-storage` anchors in values.yaml directly with the blocks shown
#       here, or
#   (b) keep a dedicated GKE values.yaml whose anchors already use these values.
# The non-storage overrides (serviceAccount annotations, dotenv) are safe to use
# as a `-f` overlay as-is.
#
# Replace every <PLACEHOLDER> below for your project.

applications:
  control-plane-backend:
    # --- Workload Identity: bind the KSA to a Google service account (GSA) ---
    # The GSA needs roles/storage.objectAdmin on the content bucket. It does NOT
    # need iam.serviceAccounts.signBlob while content_storage.url_strategy is
    # "proxy": team banner/logo images are streamed by the backend behind an
    # application-signed URL rather than a GCS V4 signed URL. Grant signBlob
    # (typically roles/iam.serviceAccountTokenCreator) on the signing service
    # account when flipping back to "presigned" (see
    # docs/swift/rfc/CONTENT-URL-STRATEGY-RFC.md and
    # docs/swift/rfc/GCS-TABULAR-SIGNED-URL-RFC.md).
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: "<GSA_NAME>@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

    configuration:
      storage:
        # --- Content store: native GCS (bucket must already exist) ---
        # bucket_name is suffixed at runtime → -objects (team banners/logos).
        content_storage:
          type: gcs
          # Browser-facing team banner/logo URLs are served by this backend's
          # signed object proxy instead of GCS V4 signed URLs, because this
          # deployment does not hold iam.serviceAccounts.signBlob (see
          # docs/swift/rfc/CONTENT-URL-STRATEGY-RFC.md). Requires
          # CONTROL_PLANE_CONTENT_URL_SECRET in dotenv below. Flip back to
          # "presigned" (and set signing_service_account_email) once the
          # permission is granted — nothing else changes.
          url_strategy: proxy
          bucket_name: "<CONTENT_BUCKET_PREFIX>" # e.g. <GCP_PROJECT_ID>-cp-content
          project_id: "" # optional; inferred from ADC when empty
          # Only needed with url_strategy: presigned — the service account used
          # to sign V4 signed URLs for browser-facing banner/logo images via IAM
          # signBlob (keyless). It needs storage.objects.get on the -objects
          # bucket; the GSA above needs iam.serviceAccounts.signBlob on it. May
          # be the GSA itself (self-signing).
          signing_service_account_email: ""

    dotenv:
      KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET: ""
      FRED_POSTGRES_PASSWORD: ""
      OPENFGA_API_TOKEN: ""
      # Signs the team avatar URLs served by the object proxy (url_strategy: proxy).
      # `openssl rand -hex 32`, identical across replicas; startup fails when unset.
      CONTROL_PLANE_CONTENT_URL_SECRET: ""

  knowledge-flow-backend:
    # --- Workload Identity: bind the KSA to a Google service account (GSA) ---
    # The GSA needs roles/storage.objectAdmin on the content + fs buckets. It also
    # needs iam.serviceAccounts.signBlob on a signing service account (typically
    # roles/iam.serviceAccountTokenCreator) for tabular signed URLs — until that is
    # granted, content_storage.url_strategy: proxy keeps everything else working.
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: "<GSA_NAME>@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

    configuration:
      # --- Content store: native GCS (buckets must already exist) ---
      # bucket_name is suffixed at runtime → -documents / -objects / -files.
      content_storage:
        type: gcs
        # Markdown media (<img> in a document preview) is served by this backend's
        # signed object proxy instead of GCS V4 signed URLs, because this deployment
        # does not hold iam.serviceAccounts.signBlob (see
        # docs/swift/rfc/CONTENT-URL-STRATEGY-RFC.md). Requires
        # KNOWLEDGE_FLOW_CONTENT_URL_SECRET in dotenv below.
        # ⚠️ Tabular Parquet reads always sign internally, so they stay unavailable
        # until signing_service_account_email is set and url_strategy flips back to
        # "presigned".
        url_strategy: proxy
        bucket_name: "<CONTENT_BUCKET_PREFIX>" # e.g. <GCP_PROJECT_ID>-content
        project_id: "" # optional; inferred from ADC when empty
        # Only needed with url_strategy: presigned (and for tabular Parquet reads) —
        # the service account used to sign V4 signed URLs via IAM signBlob (keyless).
        # It needs storage.objects.get on the -objects bucket; the GSA above needs
        # iam.serviceAccounts.signBlob on it. May be the GSA itself (self-signing).
        signing_service_account_email: ""

      # --- Virtual filesystem: native GCS ---
      filesystem:
        type: gcs
        bucket_name: "<FS_BUCKET>" # e.g. <GCP_PROJECT_ID>-fs
        prefix: "" # optional; lets several logical roots share one bucket
        project_id: "" # optional; inferred from ADC when empty

      # --- Persistence without OpenSearch: PostgreSQL (+ pgvector) ---
      storage:
        postgres:
          host: "<POSTGRES_HOST>" # e.g. Cloud SQL private IP or proxy
          port: 5432
          database: fred
          username: fred
        resource_store:
          type: "postgres"
        tag_store:
          type: "postgres"
        metadata_store:
          type: "postgres"
        log_store:
          type: "in_memory"
        tabular_store:
          artifacts_prefix: "tabular/datasets"
          format: "parquet"
          compression: "snappy"
          pointer_chunks_enabled: false
          query:
            engine: "duckdb"
            # Tabular SQL preview reads Parquet through backend-internal V4 signed
            # URLs. On GCS these are minted via iam.serviceAccounts.signBlob using
            # content_storage.signing_service_account_email (see above).
            access_mode: "presigned_url"
            # TTL for the internal signed URL; keep short — only DuckDB uses it.
            internal_presigned_ttl_seconds: 3600
            default_max_rows: 200
            max_rows: 1000
        vector_store:
          type: pgvector
          collection_name: fred_chunks

      mcp:
        opensearch_ops_enabled: false
        filesystem_enabled: true

    # MINIO_SECRET_KEY is not required on GCS. Keep DB + auth secrets in .env/secret.
    dotenv:
      KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET: ""
      FRED_POSTGRES_PASSWORD: ""
      OPENFGA_API_TOKEN: ""
      # Signs the markdown media URLs served by the object proxy (url_strategy: proxy).
      # `openssl rand -hex 32`, identical across replicas; startup fails when unset.
      KNOWLEDGE_FLOW_CONTENT_URL_SECRET: ""
      # Signs /fs/download links — required in every deployment (no fallback key).
      KNOWLEDGE_FLOW_DOWNLOAD_SECRET: ""
