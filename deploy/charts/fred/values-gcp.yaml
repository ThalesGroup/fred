# =============================================================================
# GKE (Autopilot) overlay — native Google Cloud Storage via Workload Identity.
# =============================================================================
#
# Auth model: Application Default Credentials (ADC) through Workload Identity.
# NO service-account JSON key is committed or mounted.
#
# Replace every <PLACEHOLDER> below for your project.

applications:
  fred-agents:
    # Workload Identity supplies GCS Application Default Credentials. The GSA
    # needs object list/read/create/update/delete access on this private bucket.
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: "<GSA_NAME>@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

    configuration:
      storage:
        object_store:
          type: gcs
          # bucket_name defaults to fred-runtime; set it for a different bucket.

  control-plane-backend:
    # --- Workload Identity: bind the KSA to a Google service account (GSA) ---
    # The GSA needs roles/storage.objectAdmin on the content bucket, and
    # iam.serviceAccounts.signBlob on the signing service account below
    # (typically roles/iam.serviceAccountTokenCreator) — team banner/logo
    # images are served straight to the browser via a V4 signed URL, so this
    # signing account is required, not just an internal nicety (see
    # docs/swift/rfc/GCS-TABULAR-SIGNED-URL-RFC.md).
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: "<GSA_NAME>@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

    dotenv:
      KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET: ""
      FRED_POSTGRES_PASSWORD: ""

  knowledge-flow-backend:
    # --- Workload Identity: bind the KSA to a Google service account (GSA) ---
    # Configure published_artifacts with the S3 endpoint used by Control Plane.
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: "<GSA_NAME>@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

    configuration:
      # --- Content store: native GCS (buckets must already exist) ---
      # bucket_name is suffixed at runtime → -documents / -objects / -files.
      storage:
        postgres:
          host: "<POSTGRES_HOST>" # e.g. Cloud SQL private IP or proxy
          port: 5432
          database: fred
          username: fred_runtime
          schema: runtime
        tabular_store:
          artifacts_prefix: "tabular/datasets"
          format: "parquet"
          compression: "snappy"
          pointer_chunks_enabled: false
          query:
            engine: "duckdb"
            access_mode: "presigned_url"
            # TTL for the internal signed URL; keep short — only DuckDB uses it.
            internal_presigned_ttl_seconds: 3600
            default_max_rows: 200
            max_rows: 1000
        vector_store:
          type: pgvector
          collection_name: fred_chunks

    # Keep DB and workload identity secrets in the deployment secret.
    dotenv:
      KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET: ""
      FRED_POSTGRES_PASSWORD: ""
