          client_id: FRED_KNOWLEDGE_FLOW_CLIENT_ID
          scope: api://fred-api/.default
        delegation:
          accept_delegated_calls: true
          caller_roles_claim: [roles]
          audience: FRED_API_CLIENT_ID_GUID
          service_accounts_only: false
    dotenv:
