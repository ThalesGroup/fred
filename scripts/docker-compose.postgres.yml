services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_migrations
    ports:
      - "127.0.0.1:${FRED_MIGRATION_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_migrations"]
      interval: 2s
      timeout: 5s
      retries: 10
