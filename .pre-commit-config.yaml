repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
        name: lint
      - id: ruff-format
        name: format
        args: ["--diff"]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        name: leak
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.5
    hooks:
      - id: bandit
        name: sast
        # Scan the Python files supplied by pre-commit, including libraries.
        args: ["-s", "B101,B108"]
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.31.0
    hooks:
      # Check each affected project as a whole using its existing baseline.
      # Explicit filenames would override the project's configured include list.
      - id: basedpyright
        name: type-check-control-plane-backend
        files: ^apps/control-plane-backend/(.*\.py|pyproject\.toml|pyrightconfig\.json|uv\.lock|\.baseline/basedpyright-baseline\.json)$
        types: [file]
        pass_filenames: false
        args: ["--project", "apps/control-plane-backend", "--baseline-file", "apps/control-plane-backend/.baseline/basedpyright-baseline.json"]
      - id: basedpyright
        name: type-check-fred-agents
        files: ^apps/fred-agents/(.*\.py|pyproject\.toml|pyrightconfig\.json|uv\.lock|\.baseline/basedpyright-baseline\.json)$
