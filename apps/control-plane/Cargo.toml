[package]
name = "control-plane"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client", "http-1x"] }
base64 = "0.23.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
dotenvy = "0.15.7"
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
percent-encoding = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
temporalio-client = "=1.0.0"
temporalio-common = "=1.0.0"
temporalio-sdk = { version = "=1.0.0", default-features = false }
temporalio-macros = "=1.0.0"
temporalio-workflow = "=1.0.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "=0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4", "serde", "v5"] }
utoipa = { version = "6.0", features = ["uuid", "axum_extras", "chrono"] }
utoipa-axum = "0.3"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8", features = ["http2"] }
prost = "0.14"
flate2 = "1"
base64 = "0.23.1"
rsa = "=0.9.10"
tower = { version = "0.5", features = ["util"] }

# Test-only RSA key generation is unusably slow unoptimized.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
