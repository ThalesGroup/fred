[package]
name = "control-plane"
version = "5.0.0"
edition = "2024"

[dependencies]
fred-rust-sdk = { workspace = true }
fred-rust-agent = { path = "../../libs/fred-rust-agent" }
anyhow.workspace = true
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client", "http-1x"] }
base64 = "0.23.1"
axum = { workspace = true, features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
dotenvy = "0.15.7"
reqwest = { workspace = true, features = ["form", "query", "multipart"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
percent-encoding = "2"
regex = "1.13.1"
sqlx = { workspace = true, features = ["uuid", "chrono", "migrate", "macros", "json"] }
temporalio-client = "=1.0.0"
temporalio-common = "=1.0.0"
temporalio-sdk = { version = "=1.0.0", default-features = false }
temporalio-macros = "=1.0.0"
temporalio-workflow = "=1.0.0"
thiserror = "2.0.21"
tokio = { workspace = true, features = ["full"] }
tower-http = { version = "=0.7.0", features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
utoipa = { workspace = true, features = ["uuid", "axum_extras", "chrono"] }
utoipa-axum = "0.3"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
jsonwebtoken = { workspace = true }
axum = { version = "0.8", features = ["http2"] }
prost = "0.14"
flate2 = "1"
base64 = "0.23.1"
rsa = "=0.9.10"
tower = { version = "0.5", features = ["util"] }
