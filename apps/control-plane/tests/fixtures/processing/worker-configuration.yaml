# Source for worker-contract.json; regenerate with the worker Makefile.
# Retains the pre-E1 production profiles: CPU, extraction 90m/2h/2h, queue ingestion.
processing:
  path_base_model: .
  default_profile: fast
  profiles:
    fast:
      use_gpu: false
      generate_summary: false
      input_activity_timeout: 90m
      push_metadata_activity_timeout: 5m
      output_activity_timeout: 1h
      activity_heartbeat_timeout: 5m
      retry_initial_interval: 5s
      retry_backoff_coefficient: 2.0
      retry_maximum_interval: 20s
      retry_maximum_attempts: 3
      retry_non_retryable_error_types: []
      process_images: false
      text_splitter:
        chunk_size: 1500
        chunk_overlap: 150
        preserve_tables: true
      pdf:
        do_ocr: false
      input_processors:
      - suffix: .pdf
        class_path: knowledge_flow_worker.core.processors.input.lightweight_markdown_processor.lite_pdf_to_md_processor.LitePdfMarkdownProcessor
      - suffix: .docx
        class_path: knowledge_flow_worker.core.processors.input.docx_markdown_processor.docx_markdown_processor.DocxMarkdownProcessor
      - suffix: .doc
        class_path: knowledge_flow_worker.core.processors.input.doc_markdown_processor.doc_markdown_processor.DocMarkdownProcessor
      - suffix: .odt
        class_path: knowledge_flow_worker.core.processors.input.odt_markdown_processor.odt_markdown_processor.OdtMarkdownProcessor
      - suffix: .pptx
        class_path: knowledge_flow_worker.core.processors.input.pptx_markdown_processor.pptx_markdown_processor.PptxMarkdownProcessor
      - suffix: .ppt
        class_path: knowledge_flow_worker.core.processors.input.ppt_markdown_processor.ppt_markdown_processor.PptMarkdownProcessor
      - suffix: .csv
        class_path: knowledge_flow_worker.core.processors.input.csv_tabular_processor.csv_tabular_processor.CsvTabularProcessor
      - suffix: .xlsx
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .xls
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .xlsm
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .txt
        class_path: knowledge_flow_worker.core.processors.input.text_markdown_processor.text_markdown_processor.TextMarkdownProcessor
      - suffix: .md
        class_path: knowledge_flow_worker.core.processors.input.markdown_markdown_processor.markdown_markdown_processor.MarkdownMarkdownProcessor
      - suffix: .jsonl
        class_path: knowledge_flow_worker.core.processors.input.jsonl.jsonl_markdown_processor.JsonlMarkdownProcessor
      - suffix: .png
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .jpg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .jpeg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .gif
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .bmp
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .svg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .webp
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .ico
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
    medium:
      use_gpu: false
      generate_summary: false
      input_activity_timeout: 2h
      push_metadata_activity_timeout: 5m
      output_activity_timeout: 1h
      activity_heartbeat_timeout: 5m
      retry_initial_interval: 20s
      retry_backoff_coefficient: 2.0
      retry_maximum_interval: 2m
      retry_maximum_attempts: 5
      retry_non_retryable_error_types: []
      process_images: false
      text_splitter:
        chunk_size: 1500
        chunk_overlap: 150
        preserve_tables: true
      pdf:
        extractor: docling
        do_ocr: true
        docling_num_threads: 2
      input_processors:
      - suffix: .pdf
        class_path: knowledge_flow_worker.core.processors.input.pdf_markdown_processor.pdf_markdown_processor.PdfMarkdownProcessor
      - suffix: .docx
        class_path: knowledge_flow_worker.core.processors.input.docx_markdown_processor.docx_markdown_processor.DocxMarkdownProcessor
      - suffix: .doc
        class_path: knowledge_flow_worker.core.processors.input.doc_markdown_processor.doc_markdown_processor.DocMarkdownProcessor
      - suffix: .odt
        class_path: knowledge_flow_worker.core.processors.input.odt_markdown_processor.odt_markdown_processor.OdtMarkdownProcessor
      - suffix: .pptx
        class_path: knowledge_flow_worker.core.processors.input.pptx_markdown_processor.pptx_markdown_processor.PptxMarkdownProcessor
      - suffix: .ppt
        class_path: knowledge_flow_worker.core.processors.input.ppt_markdown_processor.ppt_markdown_processor.PptMarkdownProcessor
      - suffix: .csv
        class_path: knowledge_flow_worker.core.processors.input.csv_tabular_processor.csv_tabular_processor.CsvTabularProcessor
      - suffix: .xlsx
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .xls
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .xlsm
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .txt
        class_path: knowledge_flow_worker.core.processors.input.text_markdown_processor.text_markdown_processor.TextMarkdownProcessor
      - suffix: .md
        class_path: knowledge_flow_worker.core.processors.input.markdown_markdown_processor.markdown_markdown_processor.MarkdownMarkdownProcessor
      - suffix: .jsonl
        class_path: knowledge_flow_worker.core.processors.input.jsonl.jsonl_markdown_processor.JsonlMarkdownProcessor
      - suffix: .png
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .jpg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .jpeg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .gif
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .bmp
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .svg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .webp
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .ico
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
    rich:
      use_gpu: false
      generate_summary: false
      input_activity_timeout: 2h
      push_metadata_activity_timeout: 5m
      output_activity_timeout: 1h
      activity_heartbeat_timeout: 5m
      retry_initial_interval: 30s
      retry_backoff_coefficient: 2.0
      retry_maximum_interval: 5m
      retry_maximum_attempts: 7
      retry_non_retryable_error_types: []
      process_images: true
      text_splitter:
        chunk_size: 1500
        chunk_overlap: 150
        preserve_tables: true
      pdf:
        extractor: docling
        do_ocr: true
        docling_num_threads: 2
      input_processors:
      - suffix: .pdf
        class_path: knowledge_flow_worker.core.processors.input.pdf_markdown_processor.pdf_markdown_processor.PdfMarkdownProcessor
      - suffix: .docx
        class_path: knowledge_flow_worker.core.processors.input.docx_markdown_processor.docx_markdown_processor.DocxMarkdownProcessor
      - suffix: .doc
        class_path: knowledge_flow_worker.core.processors.input.doc_markdown_processor.doc_markdown_processor.DocMarkdownProcessor
      - suffix: .odt
        class_path: knowledge_flow_worker.core.processors.input.odt_markdown_processor.odt_markdown_processor.OdtMarkdownProcessor
      - suffix: .pptx
        class_path: knowledge_flow_worker.core.processors.input.pptx_markdown_processor.pptx_markdown_processor.PptxMarkdownProcessor
      - suffix: .ppt
        class_path: knowledge_flow_worker.core.processors.input.ppt_markdown_processor.ppt_markdown_processor.PptMarkdownProcessor
      - suffix: .csv
        class_path: knowledge_flow_worker.core.processors.input.csv_tabular_processor.csv_tabular_processor.CsvTabularProcessor
      - suffix: .xlsx
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .xls
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .xlsm
        class_path: knowledge_flow_worker.core.processors.input.excel_processor.excel_processor.ExcelProcessor
      - suffix: .txt
        class_path: knowledge_flow_worker.core.processors.input.text_markdown_processor.text_markdown_processor.TextMarkdownProcessor
      - suffix: .md
        class_path: knowledge_flow_worker.core.processors.input.markdown_markdown_processor.markdown_markdown_processor.MarkdownMarkdownProcessor
      - suffix: .jsonl
        class_path: knowledge_flow_worker.core.processors.input.jsonl.jsonl_markdown_processor.JsonlMarkdownProcessor
      - suffix: .png
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .jpg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .jpeg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .gif
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .bmp
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .svg
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .webp
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
      - suffix: .ico
        class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
scheduler:
  enabled: true
  backend: temporal
  temporal:
    host: localhost:7233
    namespace: default
    task_queue: ingestion
    workflow_id_prefix: pipeline
    connect_timeout_seconds: 5
    ingestion_workflow_parallelism: 3
    ingestion_max_concurrent_workflow_tasks: 3
    ingestion_max_concurrent_activities: 3
