# control-plane on the host, against the local stack of fred-deployment-factory.
# Secrets come from config/.env.

app:
  gcu_version: v1
  base_url: /control-plane/v1
  address: 0.0.0.0
  port: 8222
  log_level: info
  log_format: text
  # One-time root platform-admin bootstrap secret, from config/.env.
  bootstrap_token_env_var: FRED_BOOTSTRAP_TOKEN

security:
  profile: c3
  m2m:
    enabled: true
    client_id: control-plane
    secret_env_var: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET
    realm_url: http://localhost:8080/realms/app
  user:
    enabled: true
    realm_url: http://localhost:8080/realms/app
    client_id: app
  authorized_origins:
    - http://localhost:5173
storage:
  # Optional read-only historical KPI source. TLS is verified; credentials are env references.
  # history:
  #   url: https://opensearch.example.test:9200
  #   index: weaver-kpi
  #   username: fred-kpi-reader
  #   password_env_var: FRED_KPI_READER_PASSWORD
  # Enable after provisioning a bucket without versioning, Object Lock or lifecycle.
  # content:
  #   endpoint: http://localhost:8333
  #   allow_insecure: true
  #   bucket: app-content-documents
  #   access_key_env_var: FRED_CONTENT_ACCESS_KEY
  #   secret_key_env_var: FRED_CONTENT_SECRET_KEY
  postgres:
    host: localhost
    port: 5432
    database: fred
    username: fred_cp

policies:
  purge_catalog_path: ./config/lifecycle_policy_catalog.yaml

scheduler:
  lifecycle:
    enabled: false
    sweep_interval: PT10M
    batch_size: 100
    temporal:
      host: localhost:7233
      namespace: default
      task_queue: control-plane-lifecycle
      workflow_id_prefix: control-plane-lifecycle
      connect_timeout_seconds: 5
      rpc_timeout_seconds: 10

# Agent discovery and local model test source.
platform:
  # Optional: per-pod workload allowed to prepare its installed PowerPoint library.
  # No organization-wide worker identity or browser-selected task queue.
  # capability_preparation:
  #   workers:
  #     fred-agents:
  #       issuer: http://localhost:8080/realms/app
  #       audience: app
  #       client_id: fred-agents
  # Enable Ralph's fixed search tool after granting the control-plane workload
  # the fred-delegation audience and delegation_caller role accepted by KF.
  # knowledge_flow_url: http://localhost:8111/knowledge-flow/v2
  # Workload-local attestation. Binding and destination must match admission.
  inference_credentials:
    - credential_binding: mistral
      api_root: https://api.mistral.ai/v1
      api_key_env: MISTRAL_API_KEY # pragma: allowlist secret (env var name only)
    - credential_binding: openai
      api_root: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY # pragma: allowlist secret (env var name only)
  # Local test source, replacing Swift's Small/Medium static profiles.
  # Discovery lists all offers; in the Models tab, authorize chat models and
  # choose the documents' embedding model, e.g. mistral-embed.
  model_sources:
    - source_id: mistral
      revision: 1
      enabled: true
      inventory:
        kind: discovered
        url: https://api.mistral.ai/v1/models
        authentication:
          mode: bearer
          secret_env_var: MISTRAL_API_KEY # pragma: allowlist secret (env var name only)
          # API operations of the existing local test key, not OAuth scope names.
          provider_scopes: ["GET /v1/models", "POST /v1/chat/completions"]
          authority: discovery_and_inference
          # Explicit reuse of the existing Swift test key for discovery.
          accept_inference_authority: true
        qualification: mixed_capabilities_v1
        complete_inventory_guaranteed: true
      inference:
        credential_binding: mistral
        api_root: https://api.mistral.ai/v1
        wire: openai_chat
        route: standard
        dialect: mistral
        auth:
          kind: api_key
      visibility_scope: local-test-mistral-account
      # The provider list does not say which models embed; the platform attests it.
      embedding_models: [mistral-embed]
    # OpenAI's /v1/models lists chat, embedding, audio and image models without
    # capability metadata, so discovery cannot establish any aptitude. The platform
    # declares the offers it approves: chat, except the attested embedding models.
    - source_id: openai
      revision: 1
      enabled: true
      inventory:
        kind: declared
        models:
          - {id: gpt-4.1-mini}
          - {id: gpt-4.1}
          - {id: text-embedding-3-small}
          - {id: text-embedding-3-large}
      inference:
        credential_binding: openai
        api_root: https://api.openai.com/v1
        wire: openai_chat
        route: standard
        dialect: openai
        auth:
          kind: api_key
      visibility_scope: local-test-openai-account
      embedding_models: [text-embedding-3-small, text-embedding-3-large]
  runtime_catalog_sources:
    - runtime_id: fred-agents
      base_url: http://localhost:8000/fred/agents/v2
      public_base_url: /fred/agents/v2
      # Opt in only when this external runtime is running.
      enabled: false
