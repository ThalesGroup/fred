# yaml-language-server: $schema=./schema/configuration.schema.json
# control-plane on the host, against the Docker Compose backing services of
# fred-deployment-factory (make docker-up there, make docker-prepare here).
# It mirrors the k3d Weaver values (k3d-apps/fred/values-weaver.yaml there), with
# localhost addresses. Secrets come from config/.env.

app:
  gcu_version: v1
  base_url: /control-plane/v1
  address: 0.0.0.0
  port: 8222
  log_level: info
  log_format: text
  # One-time root platform-admin bootstrap secret, from config/.env.
  bootstrap_token_env_var: FRED_BOOTSTRAP_TOKEN

security:
  profile: c3
  m2m:
    enabled: true
    client_id: control-plane
    secret_env_var: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET # pragma: allowlist secret (env var name only)
    realm_url: http://keycloak:8080/realms/app
  user:
    enabled: true
    realm_url: http://keycloak:8080/realms/app
    client_id: app
  authorized_origins:
    - http://localhost:5173
  delegation:
    accept_delegated_calls: true
    service_accounts_only: true

storage:
  content:
    endpoint: http://localhost:8333
    allow_insecure: true
    bucket: app-content-documents
    prefix: ""
    access_key_env_var: FRED_CONTENT_ACCESS_KEY
    secret_key_env_var: FRED_CONTENT_SECRET_KEY # pragma: allowlist secret (env var name only)
    limits:
      downloads: 8
      file_bytes: 104857600
      s3_seconds: 120
      temp_bytes: 419430400
      transfer_seconds: 300
      uploads: 4
  postgres:
    host: localhost
    port: 5432
    database: fred_weaver
    username: fred_cp

policies:
  purge_catalog_path: ./config/lifecycle_policy_catalog.yaml

scheduler:
  lifecycle:
    enabled: true
    sweep_interval: PT10M
    batch_size: 100
    temporal:
      host: localhost:7233
      namespace: fred-weaver
      task_queue: control-plane-lifecycle
      workflow_id_prefix: control-plane-lifecycle
      connect_timeout_seconds: 5
      rpc_timeout_seconds: 10
  processing:
    enabled: true
    temporal:
      host: localhost:7233
      namespace: fred-weaver
      task_queue: manager-ingestion
    # Exported from the worker's configuration_prod.yaml by make docker-prepare.
    worker_contract_file: ./target/worker-contract.json
    worker:
      issuer: http://keycloak:8080/realms/app
      audience: control-plane
      client_id: knowledge-flow-worker
    derived:
      endpoint: http://localhost:8333
      allow_insecure: true
      bucket: app-content-documents
      prefix: ""
      access_key_env_var: FRED_CONTENT_ACCESS_KEY
      secret_key_env_var: FRED_CONTENT_SECRET_KEY # pragma: allowlist secret (env var name only)
    limits:
      artifacts: 2000
      chunks: 100000
      output_bytes: 536870912
      pending: 100

platform:
  capability_preparation:
    workers:
      fred-agents:
        issuer: http://keycloak:8080/realms/app
        audience: app
        client_id: agentic
  knowledge_flow_url: http://localhost:8111/knowledge-flow/v2
  # Workload-local attestation. Binding and destination must match admission.
  inference_credentials:
    - credential_binding: mistral
      api_root: https://api.mistral.ai/v1
      api_key_env: MISTRAL_API_KEY # pragma: allowlist secret (env var name only)
    - credential_binding: openai
      api_root: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY # pragma: allowlist secret (env var name only)
  # Discovery lists all offers; organization_models authorizes two chat models
  # and the embedding model for the demo bundle's organizations.
  model_sources:
    - source_id: mistral
      revision: 1
      enabled: true
      inventory:
        kind: discovered
        url: https://api.mistral.ai/v1/models
        authentication:
          mode: bearer
          secret_env_var: MISTRAL_API_KEY # pragma: allowlist secret (env var name only)
          # API operations of the existing local test key, not OAuth scope names.
          provider_scopes: ["GET /v1/models", "POST /v1/chat/completions"]
          authority: discovery_and_inference
          # Explicit reuse of the existing test key for discovery.
          accept_inference_authority: true
        qualification: mixed_capabilities_v1
        complete_inventory_guaranteed: true
      inference:
        credential_binding: mistral
        api_root: https://api.mistral.ai/v1
        wire: openai_chat
        route: standard
        dialect: mistral
        auth:
          kind: api_key
      visibility_scope: local-test-mistral-account
      # The provider list does not say which models embed; the platform attests it.
      embedding_models: [mistral-embed]
    # OpenAI's /v1/models carries no capability metadata and also lists
    # embedding, audio and image models: besides the attested embedding models,
    # authorize only chat models.
    - source_id: openai
      revision: 1
      enabled: true
      inventory:
        kind: discovered
        url: https://api.openai.com/v1/models
        authentication:
          mode: bearer
          secret_env_var: OPENAI_API_KEY # pragma: allowlist secret (env var name only)
          provider_scopes: ["GET /v1/models", "POST /v1/chat/completions"]
          authority: discovery_and_inference
          accept_inference_authority: true
        qualification: chat_source
        complete_inventory_guaranteed: true
      inference:
        credential_binding: openai
        api_root: https://api.openai.com/v1
        wire: openai_chat
        route: standard
        dialect: openai
        auth:
          kind: api_key
      visibility_scope: local-test-openai-account
      embedding_models: [text-embedding-3-small, text-embedding-3-large]
  organization_models:
    - organization: Acme
      sources: [mistral]
      default: {source_id: mistral, upstream_model_id: mistral-small-latest}
      fallback: null
      permitted:
        - {source_id: mistral, upstream_model_id: mistral-small-latest}
        - {source_id: mistral, upstream_model_id: mistral-medium-latest}
        - {source_id: mistral, upstream_model_id: mistral-embed}
      reasoning_enabled: []
      embedding: {source_id: mistral, upstream_model_id: mistral-embed}
    - organization: Globex
      sources: [mistral]
      default: {source_id: mistral, upstream_model_id: mistral-small-latest}
      fallback: null
      permitted:
        - {source_id: mistral, upstream_model_id: mistral-small-latest}
        - {source_id: mistral, upstream_model_id: mistral-medium-latest}
        - {source_id: mistral, upstream_model_id: mistral-embed}
      reasoning_enabled: []
      embedding: {source_id: mistral, upstream_model_id: mistral-embed}
  runtime_catalog_sources:
    - runtime_id: fred-agents
      base_url: http://localhost:8000/fred/agents/v2
      public_base_url: /fred/agents/v2
      enabled: true
