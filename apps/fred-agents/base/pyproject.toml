[project]
name = "fred-agents-base"
version = "0.1.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fred-pod>=4.5.3",
  "fred-core>=4.5.3",
  "fred-sdk[agents]>=4.5.3",
  "fred-runtime[app]>=4.6.0",
  "uvicorn>=0.35",
]

[tool.uv]
package = false

[tool.uv.sources]
fred-pod = { path = "../../../libs/fred-pod", editable = true }
fred-core = { path = "../../../libs/fred-core", editable = true }
fred-sdk = { path = "../../../libs/fred-sdk", editable = true }
fred-runtime = { path = "../../../libs/fred-runtime", editable = true }
