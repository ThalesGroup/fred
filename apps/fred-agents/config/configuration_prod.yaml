# yaml-language-server: $schema=./schema/configuration.schema.json
# fred-agents on the host, against the Docker Compose backing services of
# fred-deployment-factory, as its k3d Weaver values with localhost addresses.
app:
  gcu_version: v1
  # Must match this pod's entry in the control-plane's runtime_catalog_sources:
  # that equality is what joins a log line to its own KPI.
  runtime_id: "fred-agents"
  name: "Fred default agents"
  base_url: "/fred/agents/v2"
  host: "0.0.0.0"
  port: 8000
  log_level: "info"
  log_format: text
  # Optional hard ceiling on concurrent HTTP/WebSocket connections accepted by
  # Uvicorn. Set to null to disable the limit.
  limit_concurrency: null
  # Maximum Unicode code points accepted in one submitted chat message.
  max_chat_input_chars: 5000
  openai_compat: false # Direct template execution is forbidden by the c3 profile.

security:
  profile: c3
  m2m:
    enabled: true
    client_id: "agentic"
    realm_url: "http://keycloak:8080/realms/app"
    secret_env_var: KEYCLOAK_AGENTIC_CLIENT_SECRET # pragma: allowlist secret (env var name only)
  user:
    enabled: true
    # each agent pod is a Keycloak OAuth2 resource server
    # and validates the JWT `aud` against this client_id (strict under profile: c3).
    # For per-agent audience isolation (anti confused-deputy), every pod DEPLOYMENT
    # overrides this with its OWN Keycloak client (e.g. fred-agent / dt-agent /
    # rags-agent) via Helm values, and the realm issues user tokens whose audience
    # includes the target pod's client. The value below is the local-dev default.
    # Browser-issued: must match the tokens' `iss`, as in the control-plane and
    # knowledge-flow configs and on k3d (hosts entry `127.0.0.1 keycloak`).
    client_id: "app"
    realm_url: "http://keycloak:8080/realms/app"
  authorized_origins:
    - "http://localhost:5173"
  delegation:
    # Delegation lets a program act for a person. The program (a "workload") signs
    # in with its own service account: a Keycloak client identity that belongs to
    # the program, not to anyone. With each call it names the person, run and
    # agent the call is for. Each backend has one switch per direction.
    #
    # act_for_people (outgoing) - this backend's switch. During a person's run it
    # calls other backends with its own service-account token (security.m2m) and
    # names the person, run and agent. That service account must hold the role
    # named by caller_role (default delegation_caller) on the client named by
    # audience (default fred-delegation). In the Keycloak console: open the
    # security.m2m client, then Service account roles > Assign role. Every backend
    # it calls needs accept_delegated_calls.
    #
    # accept_delegated_calls (incoming) - believe the person a calling workload
    # names. Turn it on only if another backend calls this one for a person; it
    # then needs act_for_people as well.
    #
    # The factory's Keycloak post-install grants the agentic service account
    # delegation_caller, as on k3d.
    act_for_people: true
    accept_delegated_calls: true
    service_accounts_only: true

ai:
  knowledge_flow_url: "http://localhost:8111/knowledge-flow/v2"
  timeout:
    connect: 20
    read: 60

observability:
  # Declared rather than inherited: the schema default is already enabled on
  # 9000, and leaving it implicit reads as "this app has no metrics".
  kpi:
    prometheus:
      # Docker Prometheus reaches this host-run exporter through host.docker.internal.
      address: "0.0.0.0"
      port: 9000
    opensearch:
      enabled: true
      index: weaver-kpi
  tracer: logging    # null | logging | langfuse (needs LANGFUSE_* keys in .env)
  langfuse:
    host: "http://localhost:3001"
    # LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY in .env
    # capture_content exports prompts, model answers and tool payloads to
    # Langfuse. It breaks the content exclusion of
    # docs/swift/platform/OBSERVABILITY-AND-AUDIT.md §7 and is for a local
    # Langfuse only — never a shared or production deployment.
    # Override per-run with LANGFUSE_CAPTURE_CONTENT=true.
    capture_content: false
    # Total characters per exported payload; LANGFUSE_MAX_CONTENT_CHARS overrides.
    max_content_chars: 100000

storage:
  postgres:
    host: localhost
    port: 5432
    database: fred_weaver
    pool_pre_ping: true
    pool_recycle: 1800
    pool_timeout: 30
    username: fred_runtime
    schema: runtime
  opensearch:
    host: "https://localhost:9200"
    username: "admin"
    secure: true
    verify_certs: false
  object_store:
    type: minio
    endpoint: "http://localhost:8333"
    access_key: "admin"
    secure: false

# Used by the capability preparation worker (python -m fred_agents --mode worker).
scheduler:
  enabled: true
  temporal:
    host: "localhost:7233"
    namespace: "fred-weaver"

# Execution still runs in the pod; match the control-plane connection exactly.
inference_credentials:
  - credential_binding: mistral
    api_root: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY # pragma: allowlist secret (env var name only)
  - credential_binding: openai
    api_root: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY # pragma: allowlist secret (env var name only)

platform:
  control_plane_url: "http://localhost:8222/control-plane/v1"
