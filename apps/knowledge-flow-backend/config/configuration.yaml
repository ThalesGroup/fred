app:
  name: "Knowledge Flow Backend"
  base_url: "/knowledge-flow/v2"
  address: "0.0.0.0"
  port: 8111
  log_level: "debug"
  log_format: text
  reload: false
  reload_dir: "."
observability:
  kpi:
    log:
      enabled: true
    prometheus:
      enabled: false
    opensearch:
      enabled: false
    process_metrics_interval_sec: 0

security:
  m2m:
    enabled: true
    client_id: "knowledge-flow"
    realm_url: "http://app-keycloak:8080/realms/app"
  user:
    enabled: true
    client_id: "app"
    realm_url: "http://app-keycloak:8080/realms/app"
  delegation:
    act_for_people: true
    accept_delegated_calls: true
  authorized_origins:
    - "http://localhost:5173"
    - "http://localhost:5180"
# The Control Plane decides the organization's models: search embeds questions with its
# locked corpus model, document tools use its default chat model. This workload only
# attests the approved destinations and names the variables holding their keys.
inference_credentials:
  - credential_binding: mistral
    api_root: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY # pragma: allowlist secret (env var name only)
  - credential_binding: openai
    api_root: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY # pragma: allowlist secret (env var name only)
crossencoder_model:
  name: cross-encoder/ms-marco-MiniLM-L-12-v2
  settings:
    online: true
    local_path: ~/.cache/huggingface/hub

storage:
  postgres:
    host: localhost
    port: 5432
    database: fred
    username: fred_kf
    schema: knowledge
  opensearch:
    host: https://localhost:9200
    secure: true
    verify_certs: false
    username: admin
  tabular_store:
    artifacts_prefix: "tabular/datasets"
    format: "parquet"
    compression: "snappy"
    pointer_chunks_enabled: false
    query:
      engine: "duckdb"
      access_mode: "presigned_url"
      internal_presigned_ttl_seconds: 3600
      default_max_rows: 200
      max_rows: 1000
      # Execution guardrails: DuckDB runs on a dedicated bounded thread pool.
      # max_concurrent_queries x duckdb_memory_limit bounds the buffer manager;
      # it does not bound scalar allocation (see #2182).
      max_concurrent_queries: 2
      max_queued_queries: 4
      query_timeout_seconds: 30.0
      duckdb_threads: 1
      duckdb_memory_limit: "256MB"
      max_selected_datasets: 50
  vector_store:
    type: pgvector
    collection_name: document_vectors

control_plane_url: "http://localhost:8001"

use_gpu: true
text_splitter:
  chunk_size: 1500
  chunk_overlap: 150
  preserve_tables: true
