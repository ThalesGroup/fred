app:
  name: "Knowledge Flow Backend"
  base_url: "/knowledge-flow/v2"
  address: "0.0.0.0"
  port: 8111
  log_level: "debug"
  log_format: text
  reload: false
  reload_dir: "."
observability:
  kpi:
    log:
      enabled: true
    prometheus:
      enabled: false
    opensearch:
      enabled: false
    process_metrics_interval_sec: 0

security:
  m2m:
    enabled: true
    client_id: "knowledge-flow"
    realm_url: "http://app-keycloak:8080/realms/app"
  user:
    enabled: true
    client_id: "app"
    realm_url: "http://app-keycloak:8080/realms/app"
  delegation:
    act_for_people: true
    accept_delegated_calls: true
  authorized_origins:
    - "http://localhost:5173"
    - "http://localhost:5180"
embedding_model:
  provider: openai
  name: mistral-embed
  settings:
    base_url: https://api.mistral.ai/v1
    check_embedding_ctx_length: false
    max_retries: 0
    timeout:
      connect: 10.0
      read: 120.0
    http_client_limits:
      max_connections: 500
      max_keepalive_connections: 0
      keepalive_expiry_seconds: 10

# Configuration for the LLM used for summary, keyword generation
# and other text generation tasks.
chat_model:
  provider: openai # openai | azure | azure-apim | ollama | vertex-ai | vertex-ai-model-garden
  name: "gpt-4o-mini"
  settings:
    temperature: 0
    max_retries: 0
    timeout:
      connect: 10.0
      read: 120.0
    http_client_limits:
      max_connections: 500
      max_keepalive_connections: 0
      keepalive_expiry_seconds: 10

crossencoder_model:
  name: cross-encoder/ms-marco-MiniLM-L-12-v2
  settings:
    online: true
    local_path: ~/.cache/huggingface/hub

storage:
  postgres:
    host: localhost
    port: 5432
    database: fred
    username: fred_kf
    schema: knowledge
  opensearch:
    host: https://localhost:9200
    secure: true
    verify_certs: false
    username: admin
  tabular_store:
    artifacts_prefix: "tabular/datasets"
    format: "parquet"
    compression: "snappy"
    pointer_chunks_enabled: false
    query:
      engine: "duckdb"
      access_mode: "presigned_url"
      internal_presigned_ttl_seconds: 3600
      default_max_rows: 200
      max_rows: 1000
      # Execution guardrails: DuckDB runs on a dedicated bounded thread pool.
      # max_concurrent_queries x duckdb_memory_limit bounds the buffer manager;
      # it does not bound scalar allocation (see #2182).
      max_concurrent_queries: 2
      max_queued_queries: 4
      query_timeout_seconds: 30.0
      duckdb_threads: 1
      duckdb_memory_limit: "256MB"
      max_selected_datasets: 50
  vector_store:
    type: pgvector
    collection_name: document_vectors

control_plane_url: "http://localhost:8001"

use_gpu: true
text_splitter:
  chunk_size: 1500
  chunk_overlap: 150
  preserve_tables: true
