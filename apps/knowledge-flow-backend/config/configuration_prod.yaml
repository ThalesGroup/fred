app:
  gcu_version: v1
  name: "Knowledge Flow Backend"
  base_url: "/knowledge-flow/v2"
  address: "127.0.0.1"
  port: 8111
  log_level: info
  log_format: text
  reload: false
  reload_dir: "."
  # Must mirror the control-plane's own configuration_prod.yaml: that backend
  # DISPLAYS the quota from these values, this one ENFORCES it from them. Left
  # unset here they default to None, so `_evaluate_quota` skips the personal
  # check entirely and any team without an explicit DB limit is unlimited —
  # the UI shows "x / 5 GB" while uploads sail past it.
observability:
  kpi:
    prometheus:
      # Docker Prometheus reaches this host-run exporter through host.docker.internal.
      address: "0.0.0.0"
      port: 9111

security:
  profile: c3
  m2m:
    enabled: true
    client_id: "knowledge-flow"
    realm_url: "http://localhost:8080/realms/app"
    secret_env_var: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET # pragma: allowlist secret
  user:
    enabled: true
    client_id: "app"
    # Match the browser and workload issuer exactly under the strict profile.
    realm_url: "http://localhost:8080/realms/app"
  authorized_origins:
    - "http://localhost:5173"
  delegation:
    # Receive the verified person/run/agent from the runtime, then assert that
    # identity to the Control Plane using Knowledge Flow's own service token.
    act_for_people: true
    accept_delegated_calls: true
chat_model:
  provider: openai
  name: mistral-medium-2508 # any chat-capable model (gpt-4o, gpt-4o-mini, gpt-4.1, etc.)
  settings:
    base_url: https://api.mistral.ai/v1
embedding_model:
  provider: openai
  name: mistral-embed # or text-embedding-3-small
  settings:
    base_url: https://api.mistral.ai/v1
    check_embedding_ctx_length: false
crossencoder_model:
  name: cross-encoder/ms-marco-MiniLM-L-12-v2
  settings:
    online: true
    local_path: ~/.cache/huggingface/hub
    max_retries: 0
    timeout:
      connect: 10.0
      read: 120.0
    http_client_limits:
      max_connections: 500
      max_keepalive_connections: 0
      keepalive_expiry_seconds: 10
