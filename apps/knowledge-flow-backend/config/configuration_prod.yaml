app:
  gcu_version: v1
  name: "Knowledge Flow Backend"
  base_url: "/knowledge-flow/v2"
  address: "127.0.0.1"
  port: 8111
  log_level: info
  log_format: text
  reload: false
  reload_dir: "."
observability:
  kpi:
    prometheus:
      # Docker Prometheus reaches this host-run exporter through host.docker.internal.
      address: "0.0.0.0"
      port: 9111
    opensearch:
      enabled: true
      index: weaver-kpi

security:
  profile: c3
  m2m:
    enabled: true
    client_id: "knowledge-flow"
    realm_url: "http://keycloak:8080/realms/app"
    secret_env_var: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET # pragma: allowlist secret
  user:
    enabled: true
    client_id: "app"
    # Match the browser and workload issuer exactly under the strict profile.
    realm_url: "http://keycloak:8080/realms/app"
  authorized_origins:
    - "http://localhost:5173"
  delegation:
    # Receive the verified person/run/agent from the runtime, then assert that
    # identity to the Control Plane using Knowledge Flow's own service token.
    act_for_people: true
    accept_delegated_calls: true
# The Control Plane decides the organization's models: search embeds questions with its
# locked corpus model, document tools use its default chat model. This workload only
# attests the approved destinations and names the variables holding their keys.
inference_credentials:
  - credential_binding: mistral
    api_root: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY # pragma: allowlist secret (env var name only)
  - credential_binding: openai
    api_root: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY # pragma: allowlist secret (env var name only)
crossencoder_model:
  name: cross-encoder/ms-marco-MiniLM-L-12-v2
  settings:
    online: true
    local_path: ~/.cache/huggingface/hub
    max_retries: 0
    timeout:
      connect: 10.0
      read: 120.0
    http_client_limits:
      max_connections: 500
      max_keepalive_connections: 0
      keepalive_expiry_seconds: 10
storage:
  postgres:
    host: localhost
    port: 5432
    database: fred_weaver
    pool_size: 2
    max_overflow: 0
    pool_timeout: 30
    pool_recycle: 1800
    pool_pre_ping: true
    username: fred_kf
    schema: knowledge
  opensearch:
    host: https://localhost:9200
    secure: true
    verify_certs: false
    username: admin

  tabular_store:
    artifacts_prefix: "tabular/datasets"
    format: "parquet"
    compression: "snappy"
    pointer_chunks_enabled: false
    query:
      engine: "duckdb"
      access_mode: "presigned_url"
      internal_presigned_ttl_seconds: 3600
      default_max_rows: 200
      max_rows: 1000
      # Execution guardrails: DuckDB runs on a dedicated bounded thread pool.
      # max_concurrent_queries x duckdb_memory_limit bounds the buffer manager;
      # it does not bound scalar allocation (see #2182).
      max_concurrent_queries: 2
      max_queued_queries: 4
      query_timeout_seconds: 30.0
      duckdb_threads: 1
      duckdb_memory_limit: "256MB"
      max_selected_datasets: 50
  vector_store:
    type: opensearch
    # Base name shared with the worker: each organization's corpus is the index
    # document-vectors-<organization id>.
    index: document-vectors
    bulk_size: 1000
control_plane_url: "http://localhost:8222/control-plane/v1"

# Verified reads of the artifacts the control plane publishes.
published_artifacts:
  endpoint: http://localhost:8333
  allow_insecure: true
  bucket: app-content-documents
  access_key_env: KF_ARTIFACT_ACCESS_KEY
  secret_key_env: KF_ARTIFACT_SECRET_KEY # pragma: allowlist secret (env var name only)

use_gpu: false
text_splitter:
  chunk_size: 1500
  chunk_overlap: 150
  preserve_tables: true
