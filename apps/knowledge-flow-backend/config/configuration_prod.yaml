storage:
  postgres:
    host: localhost
    port: 5432
    database: fred
    pool_size: 2
    max_overflow: 0
    pool_timeout: 30
    pool_recycle: 1800
    pool_pre_ping: true
    username: fred_kf
    schema: knowledge
  opensearch:
    host: https://localhost:9200
    secure: true
    verify_certs: false
    username: admin

  tabular_store:
    artifacts_prefix: "tabular/datasets"
    format: "parquet"
    compression: "snappy"
    pointer_chunks_enabled: false
    query:
      engine: "duckdb"
      access_mode: "presigned_url"
      internal_presigned_ttl_seconds: 3600
      default_max_rows: 200
      max_rows: 1000
      # Execution guardrails: DuckDB runs on a dedicated bounded thread pool.
      # max_concurrent_queries x duckdb_memory_limit bounds the buffer manager;
      # it does not bound scalar allocation (see #2182).
      max_concurrent_queries: 2
      max_queued_queries: 4
      query_timeout_seconds: 30.0
      duckdb_threads: 1
      duckdb_memory_limit: "256MB"
      max_selected_datasets: 50
  vector_store:
    type: opensearch
    # Must match the index the worker writes to (configuration_worker.yaml),
    # otherwise the API searches an empty index and every RAG query returns 0.
    index: vector-index-mistral
    bulk_size: 1000
  log_store:
    type: opensearch
    index: app-logs-index
control_plane_url: "http://localhost:8001"

use_gpu: false
text_splitter:
  chunk_size: 1500
  chunk_overlap: 150
  preserve_tables: true
