# Reference for the factory-generated local ZITADEL configuration.
# Client IDs, project ID, audience scope and credentials are provisioned at runtime.
# Use `make -C ../fred-deployment-factory zitadel-configure SWIFT_SRC="$PWD"`
# for complete runnable files under /tmp/fred-idp-tests/zitadel.
app:
  gcu_version: v1
security:
  user_directory: local
  user:
    provider: oidc
    realm_url: http://localhost:8091
    client_id: ZITADEL_SPA_CLIENT_ID
    audience: ZITADEL_PROJECT_ID
    scope: urn:zitadel:iam:org:project:id:ZITADEL_PROJECT_ID:aud
    roles_claim: [roles]
  m2m:
    provider: oidc
    realm_url: http://localhost:8091
    client_id: ZITADEL_KNOWLEDGE_FLOW_CLIENT_ID
    scope: 'openid urn:zitadel:iam:org:project:id:ZITADEL_PROJECT_ID:aud urn:zitadel:iam:org:project:role:service_agent'
    secret_env_var: ZITADEL_KNOWLEDGE_FLOW_CLIENT_SECRET # pragma: allowlist secret (environment variable name only)
  delegation:
    accept_delegated_calls: true
    caller_roles_claim: [roles]
    audience: ZITADEL_PROJECT_ID
    service_accounts_only: false
