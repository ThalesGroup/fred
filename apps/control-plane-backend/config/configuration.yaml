# yaml-language-server: $schema=./schema/configuration.schema.json
app:
  name: Control Plane Backend
  base_url: /control-plane/v1
  address: 127.0.0.1
  port: 8222
  log_level: info
  gcu_version: "v1"
  default_team_max_resources_storage_size: 5368709120
  personal_max_resources_storage_size: 5368709120
  bootstrap_token_file: target/bootstrap-token # AUTHZ-07 root-admin bootstrap (dev only); run `make bootstrap-token` to create it — Fred never generates this itself

observability:
  kpi:
    log:
      enabled: true
    prometheus:
      enabled: false
    opensearch:
      enabled: false
    process_metrics_interval_sec: 0

scheduler:
  enabled: false
  # temporal: requires Temporal server + run-worker process
  # memory: execute lifecycle pass in API process (no worker needed)
  backend: temporal
  temporal:
    host: localhost:7233
    namespace: default
    task_queue: control-plane-lifecycle
    workflow_id_prefix: control-plane
    connect_timeout_seconds: 5

security:
  m2m:
    enabled: false
    realm_url: http://localhost:8080/realms/app
    client_id: control-plane
    secret_env_var: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET # pragma: allowlist secret
  user:
    enabled: false
    realm_url: http://localhost:8080/realms/app
    client_id: app
  authorized_origins:
    - http://localhost:5173
  rebac:
    enabled: false
    type: openfga
    api_url: "http://localhost:9080"

storage:
  postgres:
    sqlite_path: "~/.fred/control-plane/control_plane.sqlite3"
  content_storage:
    type: local
    root_path: "~/.fred/control-plane/content-storage"

policies:
  purge_catalog_path: ./conversation_policy_catalog.yaml

platform:
  # Optional deployer-configured frontend banners; each block is independent
  # and can be omitted to show nothing. Texts are resolved from the user's
  # locale, "en" fallback.
  # - upload_warning: banner shown on upload surfaces (document upload
  #   drawer, chat attachments).
  # - info_banner: full-width announcement banner shown above the app content
  #   on every page (including pre-auth pages). Non-dismissable; persistent
  #   by default, or auto-hidden after auto_hide_seconds.
  # frontend:
  #   upload_warning:
  #     severity: warning # info | warning | error | success
  #     messages:
  #       en: "Do not upload classified documents."
  #       fr: "Ne téléversez pas de documents classifiés."
  #   info_banner:
  #     color: "#00BBDD"
  #     auto_hide_seconds: 30 # omit for a persistent banner (the default)
  #     titles:
  #       en: "New version available"
  #       fr: "Nouvelle version disponible"
  #     messages:
  #       en: "Access the Fred documentation & blog"
  #       fr: "Accédez à la documentation et au blog de Fred."
  #     links:
  #       - url: "https://fredk8.dev"
  #         labels:
  #           en: "Go to the Fred blog"
  #           fr: "Accéder au blog de Fred"
  # Runtime pod references only. Managed agent instance enrollment is DB-backed.
  knowledge_flow_base_url: http://127.0.0.1:8111/knowledge-flow/v1
  runtime_catalog_sources:
    - runtime_id: fred-samples-agents
      base_url: http://127.0.0.1:8010/samples/agents/v1
      enabled: true
      ingress_prefix: /samples/agents/v1
    - runtime_id: fred-agents
      base_url: http://127.0.0.1:8000/fred/agents/v2
      enabled: true
      ingress_prefix: /fred/agents/v2
    - runtime_id: rags-agents
      base_url: http://127.0.0.1:8013/rags/agents/v2
      enabled: true
      ingress_prefix: /rags/agents/v2
  # Applications deployed alongside Fred, each serving its own UI (and
  # optionally its own API) container. This half owns the catalog and the
  # app__<app_id> capability only; the proxy upstreams live in the frontend
  # gateway's FRONTEND_APPLICATIONS_JSON. `ui_prefix` is what the browser
  # loads in the application frame — exactly /apps/<app_id> while the UI is
  # served from Fred's origin, an absolute https URL once it moves to its own.
  # application_sources:
  #   - app_id: example
  #     ui_prefix: /apps/example
  #     version: 1.0.0
  #     icon: extension
  #     display_name:
  #       en: "Example"
  #       fr: "Exemple"
  #     description:
  #       en: "An application served from its own container."
