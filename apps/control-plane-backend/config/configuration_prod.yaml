# yaml-language-server: $schema=./schema/configuration.schema.json
app:
  name: Control Plane Backend
  base_url: /control-plane/v1

  # one-time root platform-admin bootstrap secret,
  # for this docker/local config only — real K8s deployments use
  # bootstrap_token_env_var + a Secret instead. Run `make bootstrap-token`
  # to create it; Fred never generates or logs it itself.
  bootstrap_token_file: target/bootstrap-token

  address: 0.0.0.0
  port: 8222
  log_level: info
  default_team_max_resources_storage_size: 5368709120
  personal_max_resources_storage_size: 5368709120

scheduler:
  enabled: true
  # temporal: requires Temporal server + run-worker process
  # memory: execute lifecycle pass in API process (no worker needed)
  backend: temporal
  temporal:
    host: localhost:7233
    namespace: default
    task_queue: control-plane-lifecycle
    workflow_id_prefix: control-plane
    connect_timeout_seconds: 5

observability:
  kpi:
    prometheus:
      # Docker Prometheus reaches this host-run exporter through host.docker.internal.
      address: "0.0.0.0"
      port: 9222

security:
  profile: c3
  m2m:
    enabled: true
    realm_url: http://localhost:8080/realms/app
    client_id: control-plane
    secret_env_var: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET # pragma: allowlist secret
  user:
    enabled: true
    # Browser and host-run workloads use the same canonical issuer.
    # Deployments must replace both realm URLs with their public realm URL.
    realm_url: http://localhost:8080/realms/app
    client_id: app
  authorized_origins:
    - http://localhost:5173
  rebac:
    enabled: true
    type: openfga
    api_url: "http://localhost:9080"
  delegation:
    # Delegation lets a program act for a person. The program (a "workload") signs
    # in with its own service account: a Keycloak client identity that belongs to
    # the program, not to anyone. With each call it names the person, run and
    # agent the call is for. Each backend has one switch per direction.
    #
    # accept_delegated_calls (incoming) - this backend's switch. It believes the
    # person a calling workload names, but only when that workload's token carries
    # the role named by caller_role (default delegation_caller) on the client
    # named by audience (default fred-delegation). The role is granted in Keycloak
    # to the caller's service account; no list of callers is kept here.
    #
    # act_for_people (outgoing) - this backend never calls others for a person;
    # leave it false.
    #
    # Both are off by default. Locally, make delegation turns the right one on
    # through config/.delegation.local.json after checking a freshly issued token.
    act_for_people: false
    accept_delegated_calls: false

storage:
  postgres:
    host: localhost
    port: 5432
    database: fred
    username: fred
  opensearch:
    host: "https://localhost:9200"
    username: "admin"
    secure: true
    verify_certs: false
  content_storage:
    type: minio
    endpoint: http://localhost:8333
    access_key: "admin"
    bucket_name: "control-plane-content"
    secure: false
  log_store:
    type: opensearch
    index: app-logs-index

knowledge_bases:
  # How many times one synchronization run is attempted before Fred records it
  # as failed. Without a bound the workflow engine retries for ever, so a
  # handler that fails the same way every time never reaches a terminal state.
  # Counts the first attempt: 1 means no retry.
  run_max_attempts: 2

policies:
  purge_catalog_path: ./conversation_policy_catalog.yaml

platform:
  # # upload_warning: banner shown on upload surfaces (document upload drawer,
  # # chat attachments). Omit the block to show nothing.
  # # Platform-wide announcement banners are NOT configured here — a platform
  # # admin authors them at runtime from the Announcements admin page.
  # frontend:
  #   upload_warning:
  #     severity: warning
  #     messages:
  #       en: "Do not upload sensitive or classified documents."
  #       fr: "Ne téléversez pas de documents sensibles ou classifiés."
  frontend:
    feature_flags:
      enableInformationSystems: true # local dev — unused now the in-repo SI UI is gone, kept for the standalone rags-services page
      enableApplications: true # local dev — serves the fred-samples applications
  # Runtime pod references only. Managed agent instance enrollment is DB-backed.
  knowledge_flow_base_url: http://127.0.0.1:8111/knowledge-flow/v1
  runtime_catalog_sources:
    - runtime_id: fred-samples-agents
      base_url: http://127.0.0.1:8010/samples/agents/v1
      enabled: true
      ingress_prefix: /samples/agents/v1
    - runtime_id: fred-agents
      base_url: http://127.0.0.1:8000/fred/agents/v2
      enabled: true
      ingress_prefix: /fred/agents/v2
    - runtime_id: rags-agents
      base_url: http://127.0.0.1:8013/rags/agents/v2
      enabled: true
      ingress_prefix: /rags/agents/v2
    - runtime_id: dt-agents
      base_url: http://127.0.0.1:8020/dt/agents/v2
      enabled: true
      ingress_prefix: /dt/agents/v2
  # Register application catalog entries against typed authorization resources.
  # Configure gateway upstreams separately from browser-facing prefixes.
  # The fred-samples applications, run locally. The frontend half lives in
  # FRONTEND_APPLICATIONS_JSON (apps/frontend/.env) — nothing cross-checks the
  # two, so the app_id must match there exactly.
  application_sources:
    - app_id: document-triage
      ui_prefix: /apps/document-triage # must be exactly /apps/<app_id>
      version: 0.1.0
      icon: checklist
      display_name:
        en: "Document Triage"
        fr: "Tri de documents"
      description:
        en: "Review a folder of documents and record what was decided."
        fr: "Passer en revue un dossier de documents et consigner les décisions."
      enabled: true
