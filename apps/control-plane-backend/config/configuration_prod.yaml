# yaml-language-server: $schema=./schema/configuration.schema.json
app:
  name: Control Plane Backend
  base_url: /control-plane/v1

  # one-time root platform-admin bootstrap secret,
  # for this docker/local config only — real K8s deployments use
  # bootstrap_token_env_var + a Secret instead. Run `make bootstrap-token`
  # to create it; Fred never generates or logs it itself.
  bootstrap_token_file: target/bootstrap-token

  address: 0.0.0.0
  port: 8222
  log_level: info
  default_team_max_resources_storage_size: 5368709120
  personal_max_resources_storage_size: 5368709120

scheduler:
  enabled: true
  # temporal: requires Temporal server + run-worker process
  # memory: execute lifecycle pass in API process (no worker needed)
  backend: temporal
  temporal:
    host: temporal:7233
    namespace: default
    task_queue: control-plane-lifecycle
    workflow_id_prefix: control-plane
    connect_timeout_seconds: 5

observability:
  kpi:
    prometheus:
      port: 9222

security:
  m2m:
    enabled: true
    realm_url: http://app-keycloak:8080/realms/app
    client_id: control-plane
    secret_env_var: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET # pragma: allowlist secret
  user:
    enabled: true
    # Must be browser-reachable: this URL is served to the frontend
    # (/frontend/config -> FrontendConfig.user_auth.realm_url) and used
    # client-side by keycloak-js for silent token refresh (updateToken()).
    # "app-keycloak" only resolves inside the docker-compose network, so
    # every background refresh hangs forever once the initial login token
    # ages past its validity window. security.m2m.realm_url above is
    # correctly docker-internal since that one is backend-to-Keycloak only.
    realm_url: http://localhost:8080/realms/app
    client_id: app
  authorized_origins:
    - http://localhost:5173
  rebac:
    enabled: true
    type: openfga
    api_url: "http://localhost:9080"

storage:
  postgres:
    host: localhost
    port: 5432
    database: fred
    username: fred
  opensearch:
    host: "https://localhost:9200"
    username: "admin"
    secure: true
    verify_certs: false
  content_storage:
    type: minio
    endpoint: http://localhost:8333
    access_key: "admin"
    bucket_name: "control-plane-content"
    secure: false
  log_store:
    type: opensearch
    index: app-logs-index

policies:
  purge_catalog_path: ./conversation_policy_catalog.yaml

platform:
  # # upload_warning: banner shown on upload surfaces (document upload drawer,
  # # chat attachments). info_banner: full-width announcement banner shown
  # # above the app content on every page (including pre-auth pages),
  # # non-dismissable — persistent by default, or auto-hidden after
  # # auto_hide_seconds. Omit either block to show nothing.
  # frontend:
  #   upload_warning:
  #     severity: warning
  #     messages:
  #       en: "Do not upload sensitive or classified documents."
  #       fr: "Ne téléversez pas de documents sensibles ou classifiés."
  frontend:
    feature_flags:
      enableInformationSystems: true # local dev — unused now the in-repo SI UI is gone, kept for the standalone rags-services page
  #   info_banner:
  #     color: "#00BBDD"
  #     auto_hide_seconds: 30 # omit for a persistent banner (the default)
  #     titles:
  #       en: "New version available"
  #       fr: "Nouvelle version disponible"
  #     messages:
  #       en: "Access the Fred documentation & blog"
  #       fr: "Accédez à la documentation et au blog de Fred."
  #     links:
  #       - url: "https://fredk8.dev"
  #         labels:
  #           en: "Go to the Fred blog"
  #           fr: "Accéder au blog de Fred"
  # Runtime pod references only. Managed agent instance enrollment is DB-backed.
  knowledge_flow_base_url: http://127.0.0.1:8111/knowledge-flow/v1
  runtime_catalog_sources:
    - runtime_id: fred-samples-agents
      base_url: http://127.0.0.1:8010/samples/agents/v1
      enabled: true
      ingress_prefix: /samples/agents/v1
    - runtime_id: fred-agents
      base_url: http://127.0.0.1:8000/fred/agents/v2
      enabled: true
      ingress_prefix: /fred/agents/v2
    - runtime_id: rags-agents
      base_url: http://127.0.0.1:8013/rags/agents/v2
      enabled: true
      ingress_prefix: /rags/agents/v2
    - runtime_id: dt-agents
      base_url: http://127.0.0.1:8020/dt/agents/v2
      enabled: true
      ingress_prefix: /dt/agents/v2
  # Applications deployed alongside Fred, each serving its own UI (and
  # optionally its own API) container. This half owns the catalog and the
  # app__<app_id> capability only; the proxy upstreams live in the frontend
  # gateway's FRONTEND_APPLICATIONS_JSON. `ui_prefix` is what the browser
  # loads in the application frame — exactly /apps/<app_id> while the UI is
  # served from Fred's origin, an absolute https URL once it moves to its own.
  # application_sources:
  #   - app_id: example
  #     ui_prefix: /apps/example
  #     version: 1.0.0
  #     icon: extension
  #     display_name:
  #       en: "Example"
  #       fr: "Exemple"
  #     description:
  #       en: "An application served from its own container."
