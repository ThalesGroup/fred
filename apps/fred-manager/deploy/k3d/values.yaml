# fred-manager on the local k3d instance of fred-deployment-factory, as its own
# Helm release of this repository's chart (deploy/charts/fred), next to fred-app:
#   make k3d-app DIR=../fred/apps/fred-manager   (from fred-deployment-factory)
# Same vocabulary as fred's deploy/k3d/values.yaml: address, secret, posture, sizing.
# Image tags are not set here: ./build writes them into the values the helmfile adds.

# This release renders fred-manager only; fred-app owns every other application.
applications:
  fred-agents: { enabled: false }
  frontend: { enabled: false }
  knowledge-flow-backend: { enabled: false }
  knowledge-flow-worker: { enabled: false }
  knowledge-flow-worker-extraction-fast: { enabled: false }
  knowledge-flow-worker-extraction-medium: { enabled: false }
  knowledge-flow-worker-extraction-rich: { enabled: false }
  control-plane-backend: { enabled: false }
  control-plane-worker: { enabled: false }

  fred-manager:
    enabled: true
    applicationName: fred-manager
    deployment:
      enabled: true
    replicaCount: 1                        # sizing
    autoscaling:
      enabled: false
    statefulset:
      enabled: false
    job:
      enabled: false
    migration:
      enabled: false                       # sqlx migrations run at startup
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    image:
      repository: ghcr.io/thalesgroup/fred-agent/fred-manager
      tag: ""
      pullPolicy: IfNotPresent
    command:
      enabled: false                       # the image's `fred-manager serve`
    env:
      - name: CONFIG_FILE
        value: "/app/config/configuration.yaml"
    extraEnvVars:                          # secret
      - name: KEYCLOAK_FRED_MANAGER_CLIENT_SECRET
        valueFrom:
          secretKeyRef: { name: fred-secrets, key: KEYCLOAK_FRED_MANAGER_CLIENT_SECRET, optional: false }
      - name: FRED_POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef: { name: fred-secrets, key: POSTGRES_FRED_PASSWORD, optional: false }
      - name: OPENFGA_API_TOKEN
        valueFrom:
          secretKeyRef: { name: fred-secrets, key: OPENFGA_API_TOKEN, optional: false }
      # Root platform-admin bootstrap: the control-plane's own secret, deliberately
      # shared; each service keeps its own one-time completion marker.
      - name: FRED_BOOTSTRAP_TOKEN
        valueFrom:
          secretKeyRef: { name: fred-secrets, key: CONTROL_PLANE_BOOTSTRAP_TOKEN, optional: false }
    ports:
      - name: http
        containerPort: 8400
    service:
      annotations: {}
      extraLabels: {}
      type: ClusterIP
      ports:
        - name: http
          port: 8400
          targetPort: 8400
    metricsService:
      enabled: false
    ingress:                               # address: http://localhost:8088/fred-manager
      enabled: true
      className: "traefik"
      hosts:
        - host: ""
          paths:
            - { path: /fred-manager, pathType: Prefix, service: { name: fred-manager, port: 8400 } }
      tls: []
    httpRoute:
      enabled: false
    volumeMounts:
      - name: fred-manager-vol
        mountPath: /app/config/configuration.yaml
        subPath: configuration.yaml
      - name: fred-manager-env-vol
        mountPath: /app/config/.env
        subPath: .env
    volumes:
      - name: fred-manager-vol
        configMap:
          name: fred-manager-back
      - name: fred-manager-env-vol
        secret:
          secretName: fred-manager-env
    probes:
      lifecycle:
        enabled: false
      livenessProbe:
        enabled: true
        data:
          failureThreshold: 10
          httpGet:
            path: /fred-manager/v1/healthz
            port: 8400
          periodSeconds: 10
      readinessProbe:
        enabled: true
        data:
          failureThreshold: 10
          httpGet:
            path: /fred-manager/v1/healthz
            port: 8400
          periodSeconds: 10
      startupProbe:
        enabled: false
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      runAsUser: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    serviceAccount:
      annotations: {}
      labels: {}
      automountServiceAccountToken: false
      rbac:
        enabled: false
        permissions: {}
    kubeconfig:
      enabled: false
    configuration_type:
      backend: true
      frontend: false
    configurationFileName: "configuration.yaml"
    dotenv: {}                             # secrets come from extraEnvVars above
    configuration:
      app:
        gcu_version: v1
        name: "Fred Manager"
        base_url: "/fred-manager/v1"
        address: "0.0.0.0"
        port: 8400
        log_level: "info"
        log_format: "json"
        bootstrap_token_env_var: "FRED_BOOTSTRAP_TOKEN"
      security:
        profile: c3                        # posture
        m2m:
          realm_url: "http://keycloak:8080/realms/app"
          enabled: true
          client_id: fred-manager
          secret_env_var: KEYCLOAK_FRED_MANAGER_CLIENT_SECRET
        user:
          realm_url: "http://keycloak:8080/realms/app"         # address
          client_id: app
        authorized_origins:                # address
          - "http://localhost:8088"
        rebac:
          type: openfga
          api_url: "http://openfga:9080"   # address
          store_name: fred-manager
      storage:
        postgres:
          host: postgres                   # address
          port: 5432
          database: fred
          username: fred
      scheduler:
        temporal:
          host: "temporal:7233"            # address
          namespace: default
          task_queue: fred-ingestion
