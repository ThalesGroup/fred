        - suffix: ".md"
          class_path: knowledge_flow_worker.core.processors.input.markdown_markdown_processor.markdown_markdown_processor.MarkdownMarkdownProcessor
        - suffix: ".png"
          class_path: knowledge_flow_worker.core.processors.input.image_processor.image_processor.ImageProcessor
        - suffix: ".jpg"
