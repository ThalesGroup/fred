scheduler:
  enabled: true
  backend: "temporal"
  temporal:
    host: "localhost:7233"
    namespace: "default"
    task_queue: "ingestion"
    workflow_id_prefix: "pipeline"
    connect_timeout_seconds: 5
    ingestion_workflow_parallelism: 3
    ingestion_max_concurrent_workflow_tasks: 3
    ingestion_max_concurrent_activities: 3
# The Control Plane admits each stage's embedding and vision models under the
# organization's policy. This workload only attests the approved destinations and
# names the variables holding their keys; it chooses no model.
inference_credentials:
  - credential_binding: mistral
    api_root: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY # pragma: allowlist secret (env var name only)
  - credential_binding: openai
    api_root: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY # pragma: allowlist secret (env var name only)
storage:
  postgres:
    host: localhost
    port: 5432
    database: fred
    pool_size: 2
    max_overflow: 0
    pool_timeout: 30
    pool_recycle: 1800
    pool_pre_ping: true
    username: fred_kf
    schema: knowledge
  opensearch:
    host: https://localhost:9200
    secure: true
    verify_certs: false
    username: admin

  tabular_store:
    artifacts_prefix: "tabular/datasets"
    format: "parquet"
    compression: "snappy"
    pointer_chunks_enabled: false
    query:
      engine: "duckdb"
      access_mode: "presigned_url"
      internal_presigned_ttl_seconds: 3600
      default_max_rows: 200
      max_rows: 1000
      # Execution guardrails: DuckDB runs on a dedicated bounded thread pool.
      # max_concurrent_queries x duckdb_memory_limit bounds the buffer manager;
      # it does not bound scalar allocation (see #2182).
      max_concurrent_queries: 2
      max_queued_queries: 4
      query_timeout_seconds: 30.0
      duckdb_threads: 1
      duckdb_memory_limit: "256MB"
      max_selected_datasets: 50
  vector_store:
    type: opensearch
    index: vector-index-mistral
    bulk_size: 1000
