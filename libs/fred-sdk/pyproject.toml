[project]
name = "fred-sdk"
version = "4.2.1"
description = "Authoring SDK for Fred agents — graph, ReAct, and team agent primitives."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Thales", email = "noreply@thalesgroup.com" }]
dependencies = [
  # Deliberately lean: configuration, identity, naming and plain contract
  # models only. The agent platform (fred-core, langchain, langgraph) lives
  # behind the `agents` extra so a Knowledge Base pod never installs it.
  "fred-pod>=4.2.1",
  "pydantic>=2.7.0,<3.0.0",
  "httpx>=0.28.1",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
urls = { Homepage = "https://site.fredlab.dev", Repository = "https://github.com/ThalesGroup/fred" }

[project.optional-dependencies]
# The agent authoring surface: graph, ReAct, capability and runtime contracts,
# plus the fred-core platform behind them. A Knowledge Base pod never needs it.
agents = [
  "fred-core>=4.2.1",
  "langchain-core>=0.3.0",
  "langchain>=1.3.14",
  "langgraph>=1.2.9",
]
# Only a Knowledge Base pod serving runs needs the workflow engine; agentic
# pods import fred-sdk without it. `worker.py` is imported lazily so `publish`
# never loads it either.
knowledge-base = [
  "temporalio>=1.7.0",
]
dev = [
  "fred-sdk[agents]",
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
  # Not a runtime dependency of the SDK (see `knowledge-base` above), but the
  # test suite validates the Knowledge Base workflow inside a real Temporal
  # sandbox — a guard that only protects anything if it actually runs.
  "temporalio>=1.7.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_sdk*"]

[tool.setuptools.package-data]
"fred_sdk" = ["resources/prompts/*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
markers = ["integration: marks tests that require external services"]
testpaths = ["tests"]

[tool.uv.sources]
# Local path overrides for mono-repo development only.
# These are ignored when the package is built and published — the published
# wheel resolves both from PyPI via [project.dependencies].
fred-core = { path = "../fred-core", editable = true }
fred-pod = { path = "../fred-pod", editable = true }

[dependency-groups]
dev = [
  "fred-sdk[agents]",
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
  "temporalio>=1.7.0",
]
