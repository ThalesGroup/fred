[project]
name = "fred-capability-web-research"
version = "0.1.0"
description = "Fred native web search and page reading through controlled HTTPS egress"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["fred-sdk[agents]>=4.4.0", "langchain-core>=1.6.5", "pydantic>=2.7,<3"]

[project.entry-points."fred.capabilities"]
web_research = "fred_capability_web_research.capability:WebResearchCapability"

[project.optional-dependencies]
egress = ["fastapi>=0.139.0", "uvicorn>=0.35", "httpx>=0.28.1,<0.29", "httpcore>=1.0.9,<2", "trafilatura>=2.0,<3", "prometheus-client>=0.21"]
dev = ["fred-capability-web-research[egress]"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_capability_web_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
fred-pod = { path = "../../fred-pod", editable = true }
fred-core = { path = "../../fred-core", editable = true }
fred-sdk = { path = "../../fred-sdk", editable = true }
fred-runtime = { path = "../../fred-runtime", editable = true }

[dependency-groups]
dev = ["fred-runtime[app]>=4.4.0", "fred-capability-web-research[egress]", "bandit>=1.8.6", "basedpyright==1.31.0", "detect-secrets>=1.5.0", "pytest>=8.4.2", "pytest-asyncio>=1.2.0", "pytest-cov>=6.2.1", "pytest-socket>=0.7.0", "ruff>=0.12.5"]
