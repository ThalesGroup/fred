[project]
name = "fred-capability-documents"
version = "0.1.0"
description = "Fred agent capabilities over the Knowledge Flow document ports: summarize, similarity, label search, extract, verbatim read."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Thales", email = "noreply@thalesgroup.com" }]
dependencies = [
  "fred-core>=4.0.0",
  "fred-sdk[agents]>=4.2.0",
  "pydantic>=2.7.0,<3.0.0",
  "langchain-core>=0.3.0",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
urls = { Homepage = "https://site.fredlab.dev", Repository = "https://github.com/ThalesGroup/fred" }

# Installing this package IS the registration: the fred-agents pod discovers
# every entry point below at boot. Each one is admin-gated (`team_scope`), so
# shipping them registered is inert until a team admin enables them.
[project.entry-points."fred.capabilities"]
document_summarize = "fred_capability_documents.document_summarize:DocumentSummarizeCapability"
document_verbatim = "fred_capability_documents.document_verbatim:DocumentVerbatimCapability"
document_extract = "fred_capability_documents.document_extract:DocumentExtractCapability"
document_similarity = "fred_capability_documents.document_similarity:DocumentSimilarityCapability"
document_label_search = "fred_capability_documents.document_label_search:DocumentLabelSearchCapability"

[project.optional-dependencies]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.15.22,<0.16",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_capability_documents*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
markers = ["integration: marks tests that require external services"]
testpaths = ["tests"]

[tool.uv.sources]
fred-pod = { path = "../../fred-pod", editable = true }
# Local path overrides for mono-repo development only; the published wheel
# resolves fred-core / fred-sdk from PyPI via [project.dependencies].
fred-core = { path = "../../fred-core", editable = true }
fred-sdk = { path = "../../fred-sdk", editable = true }
fred-runtime = { path = "../../fred-runtime", editable = true }

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.15.22,<0.16",
  # Test-only: the tests exercise entry-point discovery through fred-runtime's
  # CapabilityRegistry and build their CapabilityContext with its helper.
  "fred-runtime>=4.0.0",
]
