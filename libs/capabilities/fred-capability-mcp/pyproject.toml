[project]
name = "fred-capability-mcp"
version = "4.4.3"
description = "Catalog and packaged agent instructions for Fred's existing MCP capabilities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Thales", email = "noreply@thalesgroup.com" }]
dependencies = ["fred-sdk[agents]>=4.4.3"]

[project.optional-dependencies]
# Empty on purpose: python-deps.mk syncs `--extra dev`, and this package has no
# tests or tooling of its own.
dev = []

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_capability_mcp*"]

[tool.setuptools.package-data]
fred_capability_mcp = ["mcp_catalog.yaml", "prompts/*.md"]

[project.entry-points."fred.mcp_catalogs"]
mcp = "fred_capability_mcp:load_catalog"

[tool.uv.sources]
# Local path overrides for mono-repo development only. Ignored when the package
# is built and published: the published wheel resolves fred-sdk from PyPI.
fred-pod = { path = "../../fred-pod", editable = true }
fred-core = { path = "../../fred-core", editable = true }
fred-sdk = { path = "../../fred-sdk", editable = true }
