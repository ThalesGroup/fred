version: v1

# MCPs provided by Fred / Knowledge Flow.
servers:
  - id: "mcp-knowledge-flow-mcp-tabular"
    name: "mcp.servers.tabular.name"
    description: "mcp.servers.tabular.description"
    prompt_group_title: "tabular action"
    transport: "streamable_http"
    service: knowledge_flow
    path: mcp-tabular
    sse_read_timeout: 2000
    enabled: true
    auth_mode: "delegated"
    prompt_file: pkg://fred_capability_mcp/prompts/tabular.md

  - id: "mcp-knowledge-flow-opensearch-ops"
    name: "mcp.servers.search_opensearch.name"
    description: "mcp.servers.search_opensearch.description"
    prompt_group_title: "OpenSearch operations"
    transport: "streamable_http"
    service: knowledge_flow
    path: mcp-opensearch-ops
    sse_read_timeout: 2000
    enabled: true
    auth_mode: "delegated"

  - id: "mcp-knowledge-flow-fs"
    name: "mcp.servers.filesystem.name"
    description: "mcp.servers.filesystem.description"
    prompt_group_title: "filesystem access"
    transport: "streamable_http"
    service: knowledge_flow
    path: mcp-fs
    sse_read_timeout: 2000
    enabled: true
    auth_mode: "delegated"

  - id: "mcp-knowledge-flow-corpus"
    name: "mcp.servers.corpus.name"
    description: "mcp.servers.corpus.description"
    prompt_group_title: "corpus management"
    enabled: true
    transport: "streamable_http"
    service: knowledge_flow
    path: mcp-corpus
    sse_read_timeout: 2000
    auth_mode: "delegated"
    config_fields:
      - key: "chat_options.libraries_selection"
        type: "boolean"
        title: "mcp.servers.corpus.fields.chat_options.libraries_selection.title"
        description: "mcp.servers.corpus.fields.chat_options.libraries_selection.description"
        default: false
      - key: "chat_options.libraries_binding"
        type: "boolean"
        title: "mcp.servers.corpus.fields.chat_options.libraries_binding.title"
        description: "mcp.servers.corpus.fields.chat_options.libraries_binding.description"
        default: false
      - key: "chat_options.bound_library_ids"
        # Library ids belong to the agent scope and reset when copied to another team.
        scope_private: true
        type: "array"
        item_type: "string"
        title: "mcp.servers.corpus.fields.chat_options.bound_library_ids.title"
        description: "mcp.servers.corpus.fields.chat_options.bound_library_ids.description"
        default: []
        ui:
          widget: "document_libraries"
          visible_when: "chat_options.libraries_binding"
      - key: "chat_options.documents_selection"
        type: "boolean"
        title: "mcp.servers.corpus.fields.chat_options.documents_selection.title"
        description: "mcp.servers.corpus.fields.chat_options.documents_selection.description"
        default: false
      - key: "chat_options.attach_files"
        type: "boolean"
        title: "mcp.servers.corpus.fields.chat_options.attach_files.title"
        description: "mcp.servers.corpus.fields.chat_options.attach_files.description"
        default: false
      - key: "chat_options.search_policy_enabled"
        type: "boolean"
        title: "mcp.servers.corpus.fields.chat_options.search_policy_enabled.title"
        description: "mcp.servers.corpus.fields.chat_options.search_policy_enabled.description"
        default: false
      - key: "chat_options.search_policy"
        type: "string"
        title: "mcp.servers.corpus.fields.chat_options.search_policy.title"
        description: "mcp.servers.corpus.fields.chat_options.search_policy.description"
        enum: ["strict", "hybrid", "semantic"]
        default: "hybrid"
      - key: "chat_options.search_rag_scope_enabled"
        type: "boolean"
        title: "mcp.servers.corpus.fields.chat_options.search_rag_scope_enabled.title"
        description: "mcp.servers.corpus.fields.chat_options.search_rag_scope_enabled.description"
        default: false
      - key: "chat_options.search_rag_scope"
        type: "string"
        title: "mcp.servers.corpus.fields.chat_options.search_rag_scope.title"
        description: "mcp.servers.corpus.fields.chat_options.search_rag_scope.description"
        enum: ["corpus_only", "hybrid", "general_only"]
        default: "hybrid"

  - id: "mcp-knowledge-flow-prometheus-ops"
    name: "mcp.servers.prometheus.name"
    description: "mcp.servers.prometheus.description"
    prompt_group_title: "Prometheus operations"
    transport: "streamable_http"
    service: knowledge_flow
    path: mcp-prometheus-ops
    sse_read_timeout: 2000
    enabled: true
    auth_mode: "delegated"
