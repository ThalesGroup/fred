[project]
name = "fred-capability-word-template"
version = "4.5.1"
description = "Word template engine: an addressed map of the document and a small set of operations that fill and write any .docx template."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Thales", email = "noreply@thalesgroup.com" }]
dependencies = [
  "fred-core>=4.5.7",
  "fred-sdk[agents]>=4.5.7",
  # The router fetches the agent's Word templates from Knowledge Flow with
  # fred-runtime's `KfWorkspaceClient` and checks session ownership against
  # the pod's history store. The store and the Alembic env read
  # `storage.postgres` through fred-core only.
  "fred-runtime>=4.5.7",
  "pydantic>=2.7.0,<3.0.0",
  "langchain-core>=0.3.0",
  "langchain>=0.3.0",
  "fastapi>=0.110",
  "python-docx>=1.1",
  "sqlalchemy>=2.0",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
urls = { Homepage = "https://site.fredlab.dev", Repository = "https://github.com/ThalesGroup/fred" }

# Installing this package IS the registration (AGENT-CAPABILITY-RFC §4/§7):
# the fred-agents pod auto-discovers the capability at boot via this entry point.
[project.entry-points."fred.capabilities"]
word_template = "fred_capability_word_template.capability:WordTemplateCapability"

[project.optional-dependencies]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_capability_word_template*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
markers = ["integration: marks tests that require external services"]
testpaths = ["tests"]

[tool.uv.sources]
fred-pod = { path = "../../fred-pod", editable = true }
# Local path overrides for mono-repo development only.
# These are ignored when the package is built and published - the published
# wheel resolves fred-core / fred-sdk / fred-runtime from PyPI via
# [project.dependencies].
fred-core = { path = "../../fred-core", editable = true }
fred-sdk = { path = "../../fred-sdk", editable = true }
fred-runtime = { path = "../../fred-runtime", editable = true }

[tool.alembic]
# This capability owns its own migration tree. At deploy time
# `python -m fred_runtime migrate` finds it by entry point and sets
# script_location itself; this block is what lets the `alembic` CLI -
# and therefore the combined migration checks - reach the same tree.
script_location = "%(here)s/fred_capability_word_template/word_template_migrations"
prepend_sys_path = ["."]

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]
