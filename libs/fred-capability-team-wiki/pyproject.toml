[project]
name = "fred-capability-team-wiki"
version = "0.1.1"
description = "Fred agent capability for the team wiki: read the team's shared knowledge base (team_wiki)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Thales", email = "noreply@thalesgroup.com" }]
dependencies = [
  "fred-core>=3.4.1",
  "fred-sdk>=3.3.0",
  "pydantic>=2.7.0,<3.0.0",
  "langchain-core>=0.3.0",
  "langchain>=0.3.0",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
urls = { Homepage = "https://site.fredlab.dev", Repository = "https://github.com/ThalesGroup/fred" }

# Installing this package IS the registration (AGENT-CAPABILITY-RFC §4/§7).
[project.entry-points."fred.capabilities"]
team_wiki = "fred_capability_team_wiki.wiki.capability:TeamWikiCapability"

[project.optional-dependencies]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.15.22,<0.16",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_capability_team_wiki*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
markers = ["integration: marks tests that require external services"]
testpaths = ["tests"]

[tool.uv.sources]
# Local path overrides for mono-repo development only; the published wheel
# resolves fred-core / fred-sdk from PyPI via [project.dependencies].
fred-core = { path = "../fred-core", editable = true }
fred-sdk = { path = "../fred-sdk", editable = true }
fred-runtime = { path = "../fred-runtime", editable = true }

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.15.22,<0.16",
  # Test-only: the CapabilityRegistry boot-invariant test lives in fred-runtime.
  "fred-runtime>=3.4.2",
]
