[project]
name = "fred-runtime"
version = "4.1.0"
description = "Runtime adapters and infrastructure wiring for Fred v2 agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Thales", email = "noreply@thalesgroup.com" }]
dependencies = [
  "fred-core>=4.1.0",
  "fred-sdk[agents]>=4.1.0",
  "alembic>=1.18.4",
  "deepagents>=0.6.12",
  "httpx>=0.28.1",
  "langchain-mcp-adapters>=0.2.1",
  # langchain-mcp-adapters declares mcp>=1.24.0 with no upper bound (true for
  # every release through 0.3.1). mcp 2.0.0 (2026-07-28) is a breaking
  # rewrite langchain-mcp-adapters does not support yet — pin here to keep
  # fresh installs on mcp v1 until upstream ships v2 support. See #2194 and
  # https://github.com/langchain-ai/langchain-mcp-adapters/issues/578.
  "mcp>=1.24.0,<2.0.0",
  "langchain>=1.3.14",
  "langchain-core>=0.3.0",
  "langgraph>=1.2.9",
  "langfuse>=3.0.0",
  "requests>=2.32,<3",
  "PyYAML>=6.0",
  # multipart form parsing for /agents/capabilities/{id}/validate-config (#1974)
  "python-multipart>=0.0.9",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
urls = { Homepage = "https://site.fredlab.dev", Repository = "https://github.com/ThalesGroup/fred" }

[project.scripts]
fred-agents-cli = "fred_runtime.client:main"

# No `fred.capabilities` entry point: fred-runtime ships the capability
# FRAMEWORK, never a capability. Every capability lives in its own package
# under libs/capabilities/, and installing that package is the registration
# (RFC AGENT-CAPABILITY-RFC §4/§7).

[project.optional-dependencies]
# Install fred-runtime[app] when building an agent pod with a FastAPI HTTP server.
app = [
  "fastapi>=0.139.0",
]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fred_runtime*"]

[tool.setuptools.package-data]
fred_runtime = ["migrations/*.mako"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
markers = [
  "integration: marks tests that require external services",
  "integration_postgres: integration tests that specifically need a real PostgreSQL — docker-compose.integration.yml only provisions OpenFGA, so `make test-integration` excludes this subset by default",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fred_runtime"]
omit = [
  "fred_runtime/cli/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.uv.sources]
fred-pod = { path = "../fred-pod", editable = true }
# Local path overrides for mono-repo development only.
# These are ignored when the package is built and published — the published
fred-core = { path = "../fred-core", editable = true }
fred-sdk = { path = "../fred-sdk", editable = true }

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "basedpyright==1.31.0",
  "detect-secrets>=1.5.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.2.1",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.5",
]

[tool.alembic]
script_location = "%(here)s/fred_runtime/migrations"
