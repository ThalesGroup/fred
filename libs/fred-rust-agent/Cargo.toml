[package]
name = "fred-rust-agent"
version = "5.0.0"
edition = "2024"
publish = false

[dependencies]
async-stream = "0.3"
fred-rust-sdk.workspace = true
reqwest.workspace = true
tracing.workspace = true
futures = "0.3"
rig-agent = { version = "=0.46.0", default-features = false }
rig-core = { version = "=0.46.0", default-features = false }
rig-reqwest = { version = "=0.46.0", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
utoipa = "6.0"

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["test-util"] }
